  <text x="60" y="692" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#536168" font-weight="400">Selection never recolours an OPEN issue into a different status.</text>
  <text x="824" y="493" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#172A32" font-weight="600">WHAT A COLOUR MUST NOT SAY</text>
  <text x="824" y="535" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#172A32" font-weight="400">Green does not mean safe to build.</text>
  <text x="824" y="573" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#172A32" font-weight="400">Teal does not prove a window fits.</text>
  <text x="824" y="611" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#172A32" font-weight="400">Brown does not select a product.</text>
  <text x="824" y="649" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#172A32" font-weight="400">A clean page does not close a conflict.</text>
