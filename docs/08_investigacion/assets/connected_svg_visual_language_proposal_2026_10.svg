  <text x="40" y="36" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#DDE4E2" font-weight="600">DREAM HOUSE  /  GRAPHIC PROPOSAL</text>
  <text x="40" y="76" font-family="IBM Plex Sans, sans-serif" font-size="30" fill="#FFFDFA" font-weight="600">One calm base. Separate meanings.</text>
  <text x="40" y="144" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#172A32" font-weight="600">A WARM TECHNICAL ATLAS</text>
  <text x="40" y="171" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#536168" font-weight="400">Colours identify roles. Shape, pattern and words keep those roles legible without colour.</text>
