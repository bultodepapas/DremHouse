  <text x="824" y="837" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#172A32" font-weight="400">Print: white paper + stable line hierarchy</text>
  <text x="824" y="872" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#172A32" font-weight="400">Both: same values, IDs, limits and authority</text>
