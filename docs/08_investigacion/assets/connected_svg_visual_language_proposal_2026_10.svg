<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="title desc">
  <title id="title">Dream House — proposed visual language specimen</title>
  <desc id="desc">Unadopted graphic proposal, not a building drawing. Warm neutral paper and dark ink form the base. Teal identifies opening or reference information. Amber ring means open evidence, red diamond means failed check, violet dash means study geometry, green denotes a narrow passed check. Cobalt corners indicate selection independently of all those states. Lineweights separate geometry from annotation and context; explicit words preserve meaning without hue.</desc>
  <metadata>{"version":"0.1","date":"2026-10-03","status":"graphic proposal only; not adopted","physical_geometry":false,"source":"connected_svg_visual_language_audit_and_plan_2026_10.md"}</metadata>
