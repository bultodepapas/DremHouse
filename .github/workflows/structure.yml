name: Structural exploration

on:
  push:
    branches: [main]
    paths:
      - 'dreamhouse/generate_structure_plan.py'
      - 'dreamhouse/rooflight_b08.json'
      - 'dreamhouse/structure/**'
      - 'docs/03_ingenierias/**'
      - 'docs/08_investigacion/**'
      - 'planos/estructura/**'
      - 'README.md'
      - '.github/scripts/build_showcase.py'
      - 'pyproject.toml'
      - '.github/workflows/structure.yml'
  pull_request:
    paths:
      - 'dreamhouse/generate_structure_plan.py'
      - 'dreamhouse/rooflight_b08.json'
      - 'dreamhouse/structure/**'
      - 'docs/03_ingenierias/**'
      - 'docs/08_investigacion/**'
      - 'planos/estructura/**'
      - 'README.md'
      - '.github/scripts/build_showcase.py'
      - 'pyproject.toml'
      - '.github/workflows/structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install analysis, optimization, and lint dependencies
        run: python -m pip install -e ".[optimization,dev]"

      - name: Lint the structural-exploration layer
        run: >-
          python -m ruff check
          dreamhouse/structure/truss.py
          dreamhouse/structure/truss_grammar.py
          dreamhouse/structure/optimize_roof.py
          dreamhouse/structure/ground_structure.py
          dreamhouse/structure/steel_checks.py
          dreamhouse/structure/systems_checks.py
          dreamhouse/structure/e1_screening.py
          dreamhouse/structure/e1_sheet.py
          dreamhouse/generate_structure_plan.py
          dreamhouse/structure/tests/test_truss_optimization.py
          dreamhouse/structure/tests/test_e1_screening.py
          dreamhouse/structure/tests/test_e1_sheet.py

      - name: Run structural regression tests
        run: python -m unittest discover -s dreamhouse/structure/tests -v

      - name: Regenerate traceable exploration outputs
        run: |
          python -m dreamhouse.structure.optimize_roof
          python -m dreamhouse.structure.ground_structure
          python -m dreamhouse.structure.e1_screening
          python dreamhouse/generate_structure_plan.py

      - name: Confirm the drawing gallery is current
        run: python .github/scripts/build_showcase.py --check-readme

      - name: Confirm generated evidence is current
        run: >-
          git diff --exit-code --
          docs/08_investigacion/roof_truss_exploration_e0.json
          docs/08_investigacion/roof_truss_exploration_e0.md
          docs/08_investigacion/ground_structure_m60_e0.json
          docs/08_investigacion/ground_structure_m60_e0.svg
          docs/08_investigacion/e1_structural_screening.json
          docs/08_investigacion/e1_structural_screening.md
          planos/estructura
