name: Connected coordination

on:
  push:
    branches: [main]
    paths:
      - 'dreamhouse/**'
      - 'planos/**'
      - 'showcase/**'
      - 'docs/00_gobernanza/**'
      - 'docs/06_gestion_y_obra/**'
      - 'pyproject.toml'
      - '.github/workflows/coordination.yml'
  pull_request:
    paths:
      - 'dreamhouse/**'
      - 'planos/**'
      - 'showcase/**'
      - 'docs/00_gobernanza/**'
      - 'docs/06_gestion_y_obra/**'
      - 'pyproject.toml'
      - '.github/workflows/coordination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing project dependencies
        run: python -m pip install -e '.[optimization,dev,presentation]' resvg-py==0.4.0 Pillow==11.3.0
      - name: Lint connected model and quantity mapping
        run: python -m ruff check dreamhouse/coordination dreamhouse/quantities
      - name: Verify source-to-view propagation and historical regressions
        run: >-
          python -m unittest discover -s dreamhouse -p 'test_*.py'
      - name: Build complete coordination candidate
        run: python -m dreamhouse.coordination --visuals --require-no-fail
      - name: Verify package and dependency freshness
        run: python -m dreamhouse.coordination --check --visuals --require-no-fail
      - name: Retain review evidence without promoting drawings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-coordination-review
          path: .build/coordination/
          if-no-files-found: warn
