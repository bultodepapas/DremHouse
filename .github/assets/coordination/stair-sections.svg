x="850" y="293" font-size="10" fill="#18313b" font-weight="700">OPEN · SC01-REAR-DISCHARGE-RELATIONSHIP</text><text x="850" y="315" font-size="11" fill="#18313b">CF-011 remains open: the captured rear-door level is 0.00 m</text><text x="850" y="332" font-size="11" fill="#18313b">while the landing at that plane is 1.90 m; EXT-ESC geometry is</text><text x="850" y="349" font-size="11" fill="#18313b">unresolved.</text><text x="850" y="386" font-size="10" fill="#18313b" font-weight="700">OPEN · SC01-STRUCTURAL-INTERFACE-COVERAGE</text><text x="850" y="408" font-size="11" fill="#18313b">SC-01 retains plan-level column reservations; selected member,</text><text x="850" y="425" font-size="11" fill="#18313b">support, connection, headroom and professional evidence are</text><text x="850" y="442" font-size="11" fill="#18313b">absent.</text><text x="70" y="710" font-size="18" fill="#18313b" font-weight="700">REAR DISCHARGE · CF-011 / CF-013</text><text x="70" y="740" font-size="13" fill="#18313b">EXT-ESC remains unlocated. The source landing datum does not locate or approve an exterior exit.</text><text x="70" y="770" font-size="13" fill="#18313b">Support reservations are plan hypotheses; member profiles, connections, nosings, headroom and guards need source evidence.</text><text x="55" y="915" font-size="14" fill="#18313b" font-weight="700">NOT FOR CONSTRUCTION · Source envelopes and arithmetic are not construction geometry or professional approval.</text></svg>