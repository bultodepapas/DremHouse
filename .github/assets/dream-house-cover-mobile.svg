    <text x="190" y="92" font-size="14" letter-spacing="3" fill="#a9afaa">BOYACÁ · COLOMBIA</text>
    <text x="42" y="245" font-size="96" font-weight="700" letter-spacing="-5">DREAM</text>
    <text x="42" y="336" font-size="96" font-weight="700" letter-spacing="-5">HOUSE</text>
    <text x="47" y="385" font-size="19" letter-spacing="1" fill="#c7c7bf">ONE HALL. ONE GREAT VOID.</text>
    <text x="47" y="416" font-size="19" letter-spacing="1" fill="#c7c7bf">ONE TECHNICAL LIFE.</text>
  </g>

  <g transform="translate(-18 300) scale(.52)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M250 430L780 342L1090 520L560 620Z" stroke="#eee9df" stroke-width="4"/>
    <path d="M250 430V778L560 954V620M1090 520V870L560 954" stroke="#eee9df" stroke-width="4"/>
    <path d="M250 430L560 620V954M780 342V690L1090 870" stroke="#eee9df" stroke-opacity=".3" stroke-width="2"/>
    <path d="M306 533L394 586V748L306 696ZM424 603L506 652V814L424 765Z" stroke="#c86442" stroke-width="10"/>
    <path d="M328 545L372 571V690L328 664Z" stroke="#eee9df" stroke-width="4"/>
    <path d="M600 658L772 627V830L600 861ZM812 619L1040 578V805L812 846Z" stroke="#eee9df" stroke-opacity=".38" stroke-width="3"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#f2ede3" transform="translate(46 865)">
