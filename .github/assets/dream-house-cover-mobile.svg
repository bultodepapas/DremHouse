<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc">
  <title id="title">Dream House — master project record</title>
  <desc id="desc">Vertical cover with the Dream House name and a line-drawn residential industrial hall.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d8d2c7" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18201f"/>
      <stop offset="1" stop-color="#080b0b"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1200" fill="url(#fade)"/>
  <rect width="720" height="1200" fill="url(#grid)"/>
  <path d="M0 878C192 832 384 916 720 842V1200H0Z" fill="#c86442" opacity=".065"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#f2ede3">
