    <text y="30" font-size="12" letter-spacing="2" fill="#929b96">NOMINAL ENVELOPE</text>
    <line x1="232" y1="-35" x2="232" y2="38" stroke="#c86442"/>
    <text x="266" y="0" font-size="37" font-weight="700">≈918 m²</text>
    <text x="266" y="30" font-size="12" letter-spacing="2" fill="#929b96">CONCEPTUAL AREA</text>
  </g>

  <path d="M46 942H674" stroke="#c86442"/>
  <text x="46" y="972" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#8f9893">V0.3 · SCHEMATIC DESIGN · NON-DIMENSIONAL</text>
</svg>
