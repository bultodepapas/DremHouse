name: RFI / consulta técnica
description: Abrir una pregunta verificable para arquitecto, ingeniero, proveedor o autoridad.
title: "[RFI] "
body:
  - type: input
    id: question
    attributes:
      label: Pregunta
      description: Una pregunta concreta que pueda cerrarse con evidencia.
    validations:
      required: true
  - type: dropdown
    id: discipline
    attributes:
      label: Disciplina principal
      options:
        - Arquitectura
        - Estructura
        - MEP y confort
        - Incendio y seguridad
        - Predio y normativa
        - Costos y contratación
        - Construcción
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Referencias
      description: Láminas, cotas, documentos, fotos o partidas afectadas.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto si queda abierta
      description: Qué decisión, entrega, costo o actividad bloquea.
    validations:
      required: true
  - type: input
    id: responsible
    attributes:
      label: Responsable de responder
      placeholder: Rol o especialista; no inventar un responsable aún no contratado.
  - type: input
    id: needed_by
    attributes:
      label: Fecha o puerta requerida
      placeholder: AAAA-MM-DD o nombre de la puerta de fase
