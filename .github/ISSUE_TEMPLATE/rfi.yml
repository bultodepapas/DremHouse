name: RFI / technical query
description: Open a verifiable question for the architect, engineer, supplier, or authority.
title: "[RFI] "
body:
  - type: input
    id: question
    attributes:
      label: Question
      description: One specific question that can be closed with evidence.
    validations:
      required: true
  - type: dropdown
    id: discipline
    attributes:
      label: Primary discipline
      options:
        - Architecture
        - Structure
        - MEP and comfort
        - Fire and life safety
        - Site and regulations
        - Cost and procurement
        - Construction
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Affected drawings, dimensions, documents, photographs, or cost items.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact if left open
      description: State which decision, deliverable, cost, or activity it blocks.
    validations:
      required: true
  - type: input
    id: responsible
    attributes:
      label: Responsible for the response
      placeholder: Role or specialist; do not invent a responsible party who has not been appointed.
  - type: input
    id: needed_by
    attributes:
      label: Required date or gate
      placeholder: YYYY-MM-DD or phase-gate name
