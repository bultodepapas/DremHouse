name: Project decision
description: Record a choice that changes criteria, scope, geometry, cost, or phase.
title: '[DECISION] '
body:
  - type: markdown
    attributes:
      value: |
        Do not turn an assumption into a frozen requirement. State the alternatives, effects, and authority.
  - type: input
    id: decision
    attributes:
      label: Decision required
      description: State the choice in one verifiable sentence.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and context
      description: Document, owner instruction, conflict, or evidence that gives rise to the decision.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives compared
      description: Include retaining the current position when it is a genuine alternative.
    validations:
      required: true
  - type: textarea
    id: effects
    attributes:
      label: Coordinated effects
      description: Architecture, structure, MEP, regulations, cost, programme, phases, and risk.
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Decision gate
      options:
        - Before site selection
        - Before schematic-design closeout
        - Before developed design
        - Before procurement
        - May remain open
    validations:
      required: true
  - type: checkboxes
    id: governance
    attributes:
      label: Governance
      options:
        - label: I reviewed the Constitution, precedence, and current decisions.
          required: true
        - label: I identified the documents that must be updated if approved.
          required: true
