[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamhouse-project-record"
version = "0.4.0"
description = "Parametric coordination and structural-screening tools for Dream House."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.scripts]
dreamhouse-optimize-roof = "dreamhouse.structure.optimize_roof:main"
dreamhouse-ground-structure = "dreamhouse.structure.ground_structure:main"
dreamhouse-e1-screening = "dreamhouse.structure.e1_screening:main"
dreamhouse-integrate = "dreamhouse.pipeline:main"

[project.optional-dependencies]
optimization = ["scipy>=1.17,<1.18", "pymoo>=0.6.2,<0.7", "SALib>=1.5,<2"]
verification = ["openseespy>=3.7,<4"]
dev = ["ruff>=0.12,<1"]
presentation = ["resvg-py>=0.4,<0.5", "pillow>=11,<12"]

[tool.setuptools.packages.find]
include = ["dreamhouse*"]

[tool.setuptools.package-data]
"dreamhouse" = [
  "pb_b05.json",
  "p2_b06.json",
  "p2_b09.json",
  "p2_b10.json",
  "p2_b13.json",
  "p2_b14.json",
  "p2_b15.json",
  "p2_b16_delta.json",
  "p2_b17_delta.json",
  "p2_b18_delta.json",
  "p2_b19_delta.json",
  "p2_b20_delta.json",
  "p2_b21_delta.json",
  "p2_b22_delta.json",
  "p2_b23_delta.json",
  "rooflight_b08.json",
  "rooflight_b11.json",
  "rooflight_b12.json",
]
"dreamhouse.structure" = ["*.json"]
"dreamhouse.model" = ["*.json"]
"dreamhouse.equipment" = ["*.json"]
"dreamhouse.cost" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
