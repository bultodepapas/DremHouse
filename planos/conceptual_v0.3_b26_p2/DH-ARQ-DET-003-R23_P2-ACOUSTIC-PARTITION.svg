 authorize procurement, fabrication or construction.</text><line x1="1160" y1="1067" x2="1160" y2="1166" stroke="#536970" stroke-width="1"/><text x="1180" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">SHEET</text><text x="1180" y="1121" font-size="15" text-anchor="start" font-weight="700" fill="#ffffff" class="">DH-ARQ-DET-003-R23</text><text x="1180" y="1146" font-size="7.5" text-anchor="start" font-weight="400" fill="#c9d8dc" class="">R23 · 2026-08-21 · SHA e56c78b010680f...</text><line x1="1450" y1="1067" x2="1450" y2="1166" stroke="#536970" stroke-width="1"/><text x="1470" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">STATUS</text><text x="1470" y="1120" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">NOT FOR</text><text x="1470" y="1141" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">CONSTRUCTION</text></svg>
