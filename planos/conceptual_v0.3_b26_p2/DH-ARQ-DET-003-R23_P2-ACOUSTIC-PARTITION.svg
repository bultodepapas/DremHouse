8aa3" class="">P2-W04R</text><text x="1115" y="495" font-size="7.5" text-anchor="start" font-weight="700" fill="#172a33" class="">200 mm</text><text x="1210" y="495" font-size="7.2" text-anchor="start" font-weight="400" fill="#172a33" class="">retained bedroom ends at hall edge</text><rect x="970" y="521" width="590" height="39" fill="#eef2f0"/><text x="980" y="545" font-size="7.8" text-anchor="start" font-weight="700" fill="#168aa3" class="">P2-W05</text><text x="1115" y="545" font-size="7.5" text-anchor="start" font-weight="700" fill="#172a33" class="">230 mm</text><text x="1210" y="545" font-size="7.2" text-anchor="start" font-weight="400" fill="#172a33" class="">insulated shell + independent inner lining</text><rect x="970" y="571" width="590" height="39" fill="#faf9f5"/><text x="980" y="595" font-size="7.8" text-anchor="start" font-weight="700" fill="#168aa3" class="">P2-W06</text><text x="1115" y="595" font-size="7.5" text-anchor="start" font-weight="700" fill="#172a33" class="">90 mm</text><text x="1210" y="595" font-size="7.2" text-anchor="start" font-weight="400" fill="#172a33" class="">reversible phase closure; upgrade if required</text><text x="960" y="680" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">03</text><text x="994" y="680" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">PROFESSIONAL HOLD POINTS</text><line x1="960" y1="691" x2="1580" y2="691" stroke="#c3ccce" stroke-width="1"/><text x="980" y="720" font-size="8.0" text-anchor="start" font-weight="400" fill="#a63f31"><tspan x="980" dy="0">Do not infer STC/Rw or fire resistance from thickness.</tspan><tspan x="980" dy="12.64">Select tested local systems after fire and acoustic briefs.</tspan><tspan x="980" dy="12.64">Engineer head tracks, anchors, bracing and steel interfaces.</tspan><tspan x="980" dy="12.64">Coordinate plumbing stacks before freezing W02 locally.</tspan><tspan x="980" dy="12.64">Mock up seals, outlets and reclaimed concea