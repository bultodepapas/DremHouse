" fill="#ebe1ee" stroke="#637278" stroke-width="1.0" class="access-space"/><text x="502.87999999999994" y="422.40000000000003" font-size="6.5" text-anchor="middle" font-weight="700" fill="#172a33" class="">G-C</text><rect x="339.8" y="262.0" width="190.79999999999998" height="117.0" fill="#ebe1ee" stroke="#637278" stroke-width="1.0" class="access-space"/><text x="435.2" y="322.5" font-size="6.5" text-anchor="middle" font-weight="700" fill="#172a33" class="">G-D</text><rect x="530.6" y="262.0" width="104.39999999999999" height="199.79999999999998" fill="#ebe1ee" stroke="#637278" stroke-width="1.0" class="access-space"/><text x="582.8000000000002" y="363.9" font-size="6.5" text-anchor="middle" font-weight="700" fill="#172a33" class="">WELL</text><polyline points="188.6,820.0 145.4,667.0 203.0,559.0 339.8,559.0 420.8,578.8 554.0,578.8" fill="none" stroke="#a63f31" stroke-width="2.6" opacity="0.92" marker-end="url(#route-arrow)" class="egress-route"/><polyline points="501.8,835.7 536.0,702.5 420.8,580.1 554.0,580.1" fill="none" stroke="#a63f31" stroke-width="1.7" opacity="0.62" marker-end="url(#route-arrow)" class="egress-route"/><polyline points="177.8,364.5 365.0,490.5 339.8,561.6 420.8,581.4 554.0,581.4" fill="none" stroke="#a63f31" stroke-width="1.7" opacity="0.62" marker-end="url(#route-arrow)" class="egress-route"/><polyline points="435.2,324.4 365.9,424.3 365.0,491.8 339.8,562.9 420.8,582.7 554.0,582.7" fill="none" stroke="#a63f31" stroke-width="1.7" opacity="0.62" marker-end="url(#route-arrow)" class="egress-route"/><polyline points="582.8,367.1 365.0,493.1 339.8,564.2 420.8,584.0 554.0,584.0" fill="none" stroke="#a63f31" stroke-width="1.7" opacity="0.62" marker-end="url(#route-arrow)" class="egress-route"/><polyline points="365.0,487.9 711.0,487.0" fill="none" stroke="#168aa3" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#route-arrow)" class="reserved-second-route"/><rect x="655.0" y="467.0" width="70" height="40" fill="none" stroke="#168aa3" stroke-width="1.8" stroke-dasharray="6 4" class="retractable-stair-reserve"/><text x="690.0" y="460.0" font-size="6.8" text-anchor="middle" font-weight="700" fill="#168aa3" class="">RESERVED SECOND ROUTE</text><line x1="95.0" y1="514.0" x2="635.0" y2="514.0" stroke="#76558f" stroke-width="3" stroke-dasharray="9 6"/><text x="760" y="176" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">01</text><text x="794" y="176" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">VERIFIED ACCESS TOPOLOGY</text><line x1="760" y1="187" x2="1540" y2="187" stroke="#c3ccce" stroke-width="1"/><text x="760" y="213" font-size="9.2" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="760" dy="0">Every enclosed room reaches ESC through a declared door/opening.</tspan><tspan x="760" dy="15.179999999999998">The Phase 2 lobby also reaches a reserved rear retractable stair.</tspan><tspan x="760" dy="15.179999999999998">That exterior device is a geometric reserve, not an approved exit.</tspan><tspan x="760" dy="15.179999999999998">The main stair still arrives in a shared protected lobby.</tspan></text><text x="760" y="355" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">02</text><text x="794" y="355" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">PHASING LOGIC</text><line x1="760" y1="366" x2="1540" y2="366" stroke="#c3ccce" stroke-width="1"/><text x="760" y="392" font-size="9.2" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="760" dy="0">F1: primary suite, Child 1, shared centre, laundry and protected stair.</tspan><tspan x="760" dy="15.179999999999998">F2: Child 2, guest suite and wellness behind one controlled boundary.</tspan><tspan x="760" dy="15.179999999999998">The temporary enclosure must coordinate fire, dust, noise and services.</tspan></text><rect x="760" y="510" width="790" height="132" fill="#f5ded8" stroke="#bf7468" stroke-width="1.2" rx="6"/><text x="782" y="542" font-size="9" text-anchor="start" font-weight="700" fill="#a63f31" class="">LIFE-SAFETY HOLD POINT</text><text x="782" y="572" font-size="8.7" text-anchor="start" font-weight="400" fill="#6f3028"><tspan x="782" dy="0">A retractable exterior stair reserve is shown, but is not yet an accepted exit.</tspan><tspan x="782" dy="12.614999999999998">This diagram does not validate travel distance, occupant load, fire rating,</tspan><tspan x="782" dy="12.614999999999998">deployment under fire/power loss, accessibility or the required number of exits.</tspan><tspan x="782" dy="12.614999999999998">D-021 and the professional fire review remain mandatory before freezing P2.</tspan></text><text x="760" y="710" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">03</text><text x="794" y="710" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">STRUCTURAL INTERFACE</text><line x1="760" y1="721" x2="1540" y2="721" stroke="#c3ccce" stroke-width="1"/><text x="760" y="747" font-size="9.2" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="760" dy="0">D-048 retains four foundation-to-roof column reservations around ESC.</tspan><tspan x="760" dy="15.179999999999998">Stair flights are not counted as the primary lateral system.</tspan><tspan x="760" dy="15.179999999999998">Landing drift joints, enclosure fire rating and clear widths remain open.</tspan></text><text x="95" y="960" font-size="9" text-anchor="start" font-weight="700" fill="#2e7252" class="">ACCESS GRAPH: 22 PASS · 0 FAIL · 3 OPEN</text><rect x="36" y="1060" width="1612" height="106" fill="#172a33"/><rect x="36" y="1060" width="1612" height="7" fill="#168aa3"/><text x="56" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">CONTROLLED OUTCOME</text><text x="56" y="1120" font-size="13" text-anchor="start" font-weight="700" fill="#ffffff" class="">D-058 · CONTINUOUS X=21 ACOUSTIC ENCLOSURE · DESIGN COORDINATION</text><text x="56" y="1145" font-size="7.8" text-anchor="start" font-weight="400" fill="#d3dfe2" class="">Current architectural coordination hypothesis. It does not authorize procurement, fabrication or construction.</text><line x1="1160" y1="1067" x2="1160" y2="1166" stroke="#536970" stroke-width="1"/><text x="1180" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">SHEET</text><text x="1180" y="1121" font-size="15" text-anchor="start" font-weight="700" fill="#ffffff" class="">DH-ARQ-DIA-001-R11</text><text x="1180" y="1146" font-size="7.5" text-anchor="start" font-weight="400" fill="#c9d8dc" class="">R11 · 2026-08-13 · SHA 0fcb66c4d3d007...</text><line x1="1450" y1="1067" x2="1450" y2="1166" stroke="#536970" stroke-width="1"/><text x="1470" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">STATUS</text><text x="1470" y="1120" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">NOT FOR</text><text x="1470" y="1141" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">CONSTRUCTION</text></svg>
