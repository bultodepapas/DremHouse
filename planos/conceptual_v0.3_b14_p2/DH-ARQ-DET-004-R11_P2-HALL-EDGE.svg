t-weight="700" fill="#172a33" class="">OPAQUE PORTIONS: P2-W01 BUILD-UP · 250 mm NOMINAL</text><text x="470.0" y="614" font-size="8.0" text-anchor="middle" font-weight="700" fill="#2e7252" class="">FLOOR → COORDINATED ROOF SOFFIT / HEAD · NO OPEN GALLERY</text><text x="930" y="165" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">02</text><text x="964" y="165" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">SCHEMATIC SECTION AT X=21</text><line x1="930" y1="176" x2="1580" y2="176" stroke="#c3ccce" stroke-width="1"/><rect x="980" y="490" width="560" height="22" fill="#c8c1b7" stroke="#172a33" stroke-width="1.2"/><text x="1515" y="538" font-size="7.4" text-anchor="end" font-weight="700" fill="#172a33" class="">P2 FLOOR EDGE</text><rect x="1100" y="255" width="32" height="235" fill="#d8e7df" stroke="#172a33" stroke-width="2.0" class="p2-w04-section"/><line x1="1116" y1="255" x2="1395" y2="205" stroke="#172a33" stroke-width="8" stroke-linecap="round"/><text x="1395" y="188" font-size="7.2" text-anchor="end" font-weight="700" fill="#172a33" class="">ROOF / SOFFIT · FINAL SLOPE + DEFLECTION TBD</text><line x1="1116" y1="270" x2="995" y2="405" stroke="#bd7626" stroke-width="8" stroke-linecap="round"/><line x1="995" y1="405" x2="1116" y2="455" stroke="#bd7626" stroke-width="8" stroke-linecap="round"/><line x1="995" y1="405" x2="1116" y2="375" stroke="#bd7626" stroke-width="5" stroke-linecap="round"/><text x="980" y="380" font-size="7.2" text-anchor="end" font-weight="700" fill="#bd7626" class="">HALL-SIDE EXPOSED</text><text x="980" y="403" font-size="8.4" text-anchor="end" font-weight="700" fill="#bd7626" class="">D-052 TRUSS</text><text x="1148" y="340" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">P2-W04</text><text x="1148" y="365" font-size="7.2" text-anchor="start" font-weight="700" fill="#172a33" class="">FULL HEIGHT</text><text x="1148" y="388" font-size="7.2" text-anchor="start" font-weight="700" fill="#172a33" class="">CONTINUOUS + SEALED</text><text x="1035" y="540" font-size="7.2" text-anchor="middle" font-weight="700" fill="#bd7626" class="">DOUBLE-HEIGHT HALL / WORKSHOPS</text><text x="1390" y="540" font-size="7.2" text-anchor="middle" font-weight="700" fill="#168aa3" class="">PRIVATE P2</text><text x="1260" y="585" font-size="7.4" text-anchor="middle" font-weight="400" fill="#172a33" class="">Truss expression remains; its supports and connections may not puncture</text><text x="1260" y="606" font-size="7.4" text-anchor="middle" font-weight="400" fill="#172a33" class="">or rigidly bridge the acoustic enclosure without an engineered detail.</text><text x="70" y="690" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">03</text><text x="104" y="690" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">NON-NEGOTIABLE CONTINUITY</text><line x1="70" y1="701" x2="850" y2="701" stroke="#c3ccce" stroke-width="1"/><text x="70" y="730" font-size="8.8" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="70" dy="0">Close the complete X=21 run; no open mezzanine or gallery condition remains.</tspan><tspan x="70" dy="13.640000000000002">Seal floor track, lateral returns, head, glazing perimeter and every service penetration.</tspan><tspan x="70" dy="13.640000000000002">Keep the twin frames decoupled; do not use truss members, blocking or services as rigid bridges.</tspan><tspan x="70" dy="13.640000000000002">At GLZ-DECK, coordinate acoustic seals, edge protection and guard resistance as one system.</tspan></text><text x="930" y="690" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">04</text><text x="964" y="690" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">OPEN PROFESSIONAL GATES</text><line x1="930" y1="701" x2="1580" y2="701" stroke="#c3ccce" stroke-width="1"/><text x="930" y="730" font-size="8.5" text-anchor="start" font-weight="400" fill="#a63f31"><tspan x="930" dy="0">Structural truss topology, supports, movement and connection strategy.</tspan><tspan x="930" dy="12.92">Roof/head deflection track and full-height fire-stopping detail.</tspan><tspan x="930" dy="12.92">Required fire/smoke separation and tested acoustic performance.</tspan><tspan x="930" dy="12.92">GLZ-DECK glass build-up, frame, guarding, height and installation.</tspan><tspan x="930" dy="12.92">Full-height mock-up and field verification before repetition.</tspan></text><rect x="930" y="910" width="650" height="94" fill="#f5ded8" stroke="#bf7468" stroke-width="1.2" rx="6"/><text x="952" y="940" font-size="8" text-anchor="start" font-weight="700" fill="#a63f31" class="">AUTHORITY</text><text x="952" y="969" font-size="8.2" text-anchor="start" font-weight="700" fill="#6f3028" class="">Frozen enclosure intent; no STC/Rw, fire rating or construction assembly is claimed.</text><rect x="36" y="1060" width="1612" height="106" fill="#172a33"/><rect x="36" y="1060" width="1612" height="7" fill="#168aa3"/><text x="56" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">CONTROLLED OUTCOME</text><text x="56" y="1120" font-size="13" text-anchor="start" font-weight="700" fill="#ffffff" class="">D-058 · CONTINUOUS X=21 ACOUSTIC ENCLOSURE · DESIGN COORDINATION</text><text x="56" y="1145" font-size="7.8" text-anchor="start" font-weight="400" fill="#d3dfe2" class="">Current architectural coordination hypothesis. It does not authorize procurement, fabrication or construction.</text><line x1="1160" y1="1067" x2="1160" y2="1166" stroke="#536970" stroke-width="1"/><text x="1180" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">SHEET</text><text x="1180" y="1121" font-size="15" text-anchor="start" font-weight="700" fill="#ffffff" class="">DH-ARQ-DET-004-R11</text><text x="1180" y="1146" font-size="7.5" text-anchor="start" font-weight="400" fill="#c9d8dc" class="">R11 · 2026-08-13 · SHA 0fcb66c4d3d007...</text><line x1="1450" y1="1067" x2="1450" y2="1166" stroke="#536970" stroke-width="1"/><text x="1470" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">STATUS</text><text x="1470" y="1120" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">NOT FOR</text><text x="1470" y="1141" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">CONSTRUCTION</text></svg>
