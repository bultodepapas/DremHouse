<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fbfaf7"/><g font-family="Arial"><text x="70" y="45" font-size="26" text-anchor="start" font-weight="700" fill="#243238">PB KITCHEN / DINING · CURRENT DIAGNOSIS + PREFERRED TEST</text><text x="70" y="72" font-size="12" text-anchor="start" font-weight="400" fill="#59676c">Current 4.50 m wall run and 3.60 m island compared with a full domestic-bay composition</text><text x="1325" y="105" font-size="16" text-anchor="end" font-weight="700" fill="#7e3f2c">OPT-001-R00</text></g><text x="70" y="117" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">A · CURRENT PB b29</text><rect x="70" y="145" width="241.5" height="414.0" fill="#f7f4ee" stroke="#26363c" stroke-width="2"/><rect x="70.0" y="306.0" width="241.5" height="92.0" fill="#fff8e7" stroke="#b87918" stroke-width="1.4" stroke-dasharray="7 4"/><text x="190.75" y="356.0" font-size="7" text-anchor="middle" font-weight="700" fill="#8d651d">4.00 m CLEAR AXIS</text><text x="190.75" y="157.65" font-size="7" text-anchor="middle" font-weight="700" fill="#506168">SIDE B</text><text x="190.75" y="553.25" font-size="7" text-anchor="middle" font-weight="700" fill="#506168">SIDE A</text><rect x="305.75" y="145.0" width="5.75" height="414.0" fill="#856246" stroke="#4f3827" stroke-width="1"/><text x="302.30000000000007" y="352.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#493426" transform="rotate(-90 302.30000000000007 352.0)">GREAT WALL</text><rect x="201.1" y="536.0" width="103.5" height="17.25" fill="#b69066" stroke="#60492f" stroke-width="1.2"/><text x="252.85" y="546.625" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff7e9">4.50 m WALL</text><rect x="208.0" y="480.8" width="82.8" height="27.599999999999998" fill="#d1b187" stroke="#60492f" stroke-width="1.2" rx="3"/><text x="249.4" y="496.59999999999997" font-size="6.3" text-anchor="middle" font-weight