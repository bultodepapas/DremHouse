ight="700" fill="#fff8ef">FZ</text><rect x="943.2" y="220" width="32.4" height="190" fill="#927051" stroke="#5a412d" stroke-width="1"/><text x="959.4000000000001" y="318.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff8ef">OV</text><rect x="975.6000000000001" y="332" width="64.8" height="78" fill="#b69066" stroke="#5a412d" stroke-width="1"/><text x="1008.0000000000001" y="374.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff8ef">LAND</text><rect x="1040.4" y="332" width="48.6" height="78" fill="#b69066" stroke="#5a412d" stroke-width="1"/><text x="1064.7" y="374.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff8ef">HOB</text><rect x="1089.0" y="332" width="64.8" height="78" fill="#b69066" stroke="#5a412d" stroke-width="1"/><text x="1121.4" y="374.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff8ef">PREP</text><rect x="1153.8000000000002" y="332" width="48.6" height="78" fill="#b69066" stroke="#5a412d" stroke-width="1"/><text x="1178.1000000000001" y="374.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff8ef">SINK</text><rect x="1202.4" y="332" width="32.4" height="78" fill="#b69066" stroke="#5a412d" stroke-width="1"/><text x="1218.6000000000001" y="374.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff8ef">DW</text><rect x="1234.8000000000002" y="332" width="32.4" height="78" fill="#b69066" stroke="#5a412d" stroke-width="1"/><text x="1251.0000000000002" y="374.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff8ef">BIN</text><rect x="1267.2" y="332" width="40.5" height="78" fill="#b69066" stroke="#5a412d" stroke-width="1"/><text x="1287.45" y="374.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#fff8ef">LAND</text><line x1="765" y1="410" x2="1307.7" y2="410" stroke="#26363c" stroke-width="2"/><text x="1036.35" y="434" font-size="7.2" text-anchor="middle" font-weight="700" fill="#243238">FULL DOMESTIC-BAY READING · STANDARD MODULAR CARCASSES</text><text x="735" y="465" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">D · WHY THE ISLAND STOPS AT 7.20 m</text><rect x="835" y="510" width="388.8" height="68" fill="#d1b187" stroke="#60492f" stroke-width="1.4" rx="4"/><text x="1029.4" y="548" font-size="8" text-anchor="middle" font-weight="700" fill="#243238">7.20 m DRY ISLAND · 8 SEATS</text><circle cx="883.8" cy="598" r="8" fill="#faf7f0" stroke="#68767a"/><circle cx="925.4" cy="598" r="8" fill="#faf7f0" stroke="#68767a"/><circle cx="967.0" cy="598" r="8" fill="#faf7f0" stroke="#68767a"/><circle cx="1008.6" cy="598" r="8" fill="#faf7f0" stroke="#68767a"/><circle cx="1050.2" cy="598" r="8" fill="#faf7f0" stroke="#68767a"/><circle cx="1091.8" cy="598" r="8" fill="#faf7f0" stroke="#68767a"/><circle cx="1133.4" cy="598" r="8" fill="#faf7f0" stroke="#68767a"/><circle cx="1175.0" cy="598" r="8" fill="#faf7f0" stroke="#68767a"/><text x="760" y="546" font-size="7" text-anchor="end" font-weight="700" fill="#8e3825">1.40 m</text><text x="1243.8" y="546" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">1.90 m</text><text x="735" y="625" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">E · ARCHITECTURAL READING</text><rect x="735" y="645" width="595" height="30" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="750" y="665" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">SPACE</text><text x="820" y="665" font-size="6.6" text-anchor="start" font-weight="400" fill="#35454b">Kitchen gains the entire Side A domestic bay; dining activates the empty Side B half.</text><rect x="735" y="685" width="595" height="30" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="750" y="705" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">USE</text><text x="820" y="705" font-size="6.6" text-anchor="start" font-weight="400" fill="#35454b">Eight island seats handle daily meals; the opposite 12-seat table becomes the formal/event table.</text><rect x="735" y="725" width="595" height="30" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="750" y="745" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">FLOW</text><text x="820" y="745" font-size="6.6" text-anchor="start" font-weight="400" fill="#35454b">The 4.00 m centreline remains untouched; 1.40 m and 1.90 m island-end routes prevent a barrier.</text><rect x="735" y="765" width="595" height="30" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="750" y="785" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">MEP</text><text x="820" y="785" font-size="6.6" text-anchor="start" font-weight="400" fill="#35454b">Keep sink, dishwasher and extraction on the wall. A dry island avoids slab drainage and duct loops.</text><rect x="735" y="805" width="595" height="30" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="750" y="825" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">COST</text><text x="820" y="825" font-size="6.6" text-anchor="start" font-weight="400" fill="#35454b">The test is close to the control-estimate total joinery length, but shifts scope into a larger island.</text><rect x="70" y="835" width="1260" height="45" fill="#fff4df" stroke="#bd5c3c" stroke-width="1"/><text x="88" y="854" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">OPTION STATUS</text><text x="185" y="854" font-size="6.8" text-anchor="start" font-weight="700" fill="#5a3a2c">Owner-requested study only. PB b29 remains current; D-024 and CF-006 remain open. Site, appliances, MEP, facade, detailed joinery and quotations must precede design freeze.</text><text x="88" y="870" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">ARCHITECT&#x27;S POSITION</text><text x="185" y="870" font-size="6.8" text-anchor="start" font-weight="700" fill="#5a3a2c">Use the whole bay visually, but retain island-end circulation. A literal 10.50 m wall-to-wall island is not recommended.</text></svg>