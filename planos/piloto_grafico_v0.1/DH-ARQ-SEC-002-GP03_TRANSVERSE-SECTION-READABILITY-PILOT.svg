  <title id="gp03-title">Transverse mono-pitch roof-section readability pilot GP03</title>
  <desc id="gp03-desc">Presentation-only pilot of the transverse section below P2. The R06 baseline, single roof plane, side walls, P2 floor datum, hall width and approximate levels are copied without coordinate changes. D-039 remains a provisional design-control value and final direction, drainage, structure and roof system remain open.</desc>
