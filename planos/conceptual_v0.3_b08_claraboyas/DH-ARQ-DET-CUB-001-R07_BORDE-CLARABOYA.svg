<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fbfaf7"/><text x="70" y="45" font-family="Arial" font-size="25" font-weight="700" text-anchor="start" fill="#233238">DETALLE CONCEPTUAL · BORDE DE CLARABOYA</text><text x="70" y="70" font-family="Arial" font-size="11" font-weight="400" text-anchor="start" fill="#59676c">Principio higrotérmico y de estanqueidad · requiere sistema certificado</text><text x="1325" y="95" font-family="Arial" font-size="15" font-weight="700" text-anchor="end" fill="#7e3f2c">DET-CUB-001-R07</text><polygon points="170,500 920,475 920,530 170,555" fill="#b9bec0" stroke="#172126" stroke-width="3"/><text x="500" y="590" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle" fill="#233238">PANEL SÁNDWICH CONTINUO HACIA ALERO BAJO</text><rect x="420" y="400" width="300" height="45" fill="#71a5b1" stroke="#173c46" stroke-width="3"/><path d="M435 430 L700 408" stroke="#d9eef2" stroke-width="4"/><path d="M405 500 L405 430 L420 430 M735 482 L735 430 L720 430" fill="none" stroke="#7f553c" stroke-width="10"/><text x="570" y="385" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle" fill="#233238">UNIDAD DE VIDRIO AISLANTE + INTERIOR LAMINADO</text><text x="380" y="418" font-family="Arial" font-size="9" font-weight="700" text-anchor="end" fill="#233238">CURB ≥0,20 m</text><text x="770" y="450" font-family="Arial" font-size="9" font-weight="700" text-anchor="start" fill="#233238">REMATE / BABETA</text><text x="770" y="477" font-family="Arial" font-size="9" font-weight="700" text-anchor="start" fill="#233238">CANAL DE DRENAJE</text><text x="170" y="680" font-family="Arial" font-size="10" font-weight="400" text-anchor="start" fill="#233238">Principio: continuidad de aire/vapor/aislamiento; doble barrera de agua; vidrio retenido mecánicamente; reemplazo desde cubierta.</text><text x="170" y="710" font-family="Arial" font-size="10" font-weight="700" text-anchor="start" fill="#963827">No aceptar domo acrílico simple ni marco sin rotura térmica para clima frío de Boyacá.</text></svg>