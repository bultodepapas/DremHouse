3" width="16" height="16" fill="#ffffff" stroke="#172a33" stroke-width="0.8"/><text x="137" y="698" font-size="7.5" text-anchor="start" font-weight="700" fill="#172a33" class="">40 CLEAR DRAINABLE / SERVICE / DECOUPLING ZONE</text><rect x="105" y="731" width="16" height="16" fill="#d8e7df" stroke="#172a33" stroke-width="0.8"/><text x="137" y="746" font-size="7.5" text-anchor="start" font-weight="700" fill="#172a33" class="">64 INDEPENDENT SERVICE FRAME + 50 GLASS WOOL</text><rect x="105" y="779" width="16" height="16" fill="#d7d2c8" stroke="#172a33" stroke-width="0.8"/><text x="137" y="794" font-size="7.5" text-anchor="start" font-weight="700" fill="#172a33" class="">12.5 RECLAIMED BOARD · CONCEALED ONLY</text><rect x="105" y="827" width="16" height="16" fill="#f7f5ef" stroke="#172a33" stroke-width="0.8"/><text x="137" y="842" font-size="7.5" text-anchor="start" font-weight="700" fill="#172a33" class="">12.5 NEW SMOOTH FINISH BOARD</text><text x="1010" y="165" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">02</text><text x="1044" y="165" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">WHY IT IS MORE EFFICIENT</text><line x1="1010" y1="176" x2="1580" y2="176" stroke="#c3ccce" stroke-width="1"/><text x="1030" y="210" font-size="8.3" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="1030" dy="0">The insulated metal panel is the weather shell.</tspan><tspan x="1030" dy="13.114000000000003">One independent inner frame carries services and finish.</tspan><tspan x="1030" dy="13.114000000000003">No redundant outer stud wall is added behind the panel.</tspan><tspan x="1030" dy="13.114000000000003">Corrugated industrial character remains outside only.</tspan><tspan x="1030" dy="13.114000000000003">Local column boxes may project beyond 230 mm.</tspan></text><text x="1010" y="430" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">03</text><text x="1044" y="430" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">DO NOT FREEZE THE 100 mm CORE YET</text><line x1="1010" y1="441" x2="1580" y2="441" stroke="#c3ccce" stroke-width="1"/><text x="1030" y="475" font-size="8.1" text-anchor="start" font-weight="400" fill="#a63f31"><tspan x="1030" dy="0">Choose the 80–120 mm panel after Boyaca climate analysis.</tspan><tspan x="1030" dy="12.798">Coordinate condensation, vapour and continuous air control.</tspan><tspan x="1030" dy="12.798">Select PIR or mineral-wool core from the fire strategy.</tspan><tspan x="1030" dy="12.798">Verify wind spans, fasteners and primary-steel interfaces.</tspan><tspan x="1030" dy="12.798">Detail windows, base, eaves, corners and cavity drainage.</tspan></text><text x="1010" y="705" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">04</text><text x="1044" y="705" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">PERIMETER / AUTHORITY</text><line x1="1010" y1="716" x2="1580" y2="716" stroke="#c3ccce" stroke-width="1"/><text x="1030" y="750" font-size="8.2" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="1030" dy="0">Apply to south, north and rear/east P2 edges.</tspan><tspan x="1030" dy="13.283999999999999">P2-W04R remains the separate hall-edge wall.</tspan><tspan x="1030" dy="13.283999999999999">No U-value, fire, acoustic or structural rating is claimed.</tspan><tspan x="1030" dy="13.283999999999999">Not for product order, fabrication or construction.</tspan></text><rect x="1030" y="905" width="520" height="84" fill="#f5ded8" stroke="#bf7468" stroke-width="1.2" rx="6"/><text x="1052" y="937" font-size="8.0" text-anchor="start" font-weight="700" fill="#a63f31" class="">D-080 REPLACES THE FORMER 300 mm DOUBLE-FRAME BASIS</text><text x="1052" y="966" font-size="7.4" text-anchor="start" font-weight="400" fill="#6f3028" class="">Envelope experience retained; illustrative construction rationalized.</text><rect x="36" y="1060" width="1612" 