ll="#243238">Dedicated secondary-steel rail and bolted brackets</text><rect x="660" y="712" width="620" height="24" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="676" y="730" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">02</text><text x="710" y="730" font-size="7.5" text-anchor="start" font-weight="400" fill="#243238">Replaceable timber top + two large suspended steel three-drawer cabinets</text><rect x="660" y="744" width="620" height="24" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="676" y="762" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">03</text><text x="710" y="762" font-size="7.5" text-anchor="start" font-weight="400" fill="#243238">Accessible separated power/data tray and task-lighting provision</text><rect x="660" y="776" width="620" height="24" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="676" y="794" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">04</text><text x="710" y="794" font-size="7.5" text-anchor="start" font-weight="400" fill="#243238">Window trimmers, seals, flashing and thermal bridge resolved as one facade detail</text><rect x="70" y="825" width="1260" height="55" fill="#fff4df" stroke="#bd5c3c" stroke-width="1"/><text x="88" y="848" font-size="10" text-anchor="start" font-weight="700" fill="#8e3825">ENGINEERING HOLD</text><text x="220" y="848" font-size="7.6" text-anchor="start" font-weight="700" fill="#5a3a2c">The rail, brackets, trimmers, loads, deflection, vibration, fire/corrosion protection and connections require professional design. Do not field-weld to primary steel or load the window frame.</text><text x="88" y="868" font-size="10" text-anchor="start" font-weight="700" fill="#8e3825">SITE HOLD</text><text x="220" y="868" font-size="7.6" text-anchor="start" font-weight="700" fill="#5a3a2c">Glare, shading, privacy, condensation, cold downdraught and operable areas remain dependent on the selected site and orientation.</text></svg