<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fbfaf7"/><g font-family="Arial"><text x="70" y="45" font-size="26" text-anchor="start" font-weight="700" fill="#243238">PB DINING · RESEARCHED 12-SEAT TABLE + TRUE CENTRING</text><text x="70" y="72" font-size="12" text-anchor="start" font-weight="400" fill="#59676c">3.20 × 1.10 m table centred with its symmetric chair and circulation envelope in the 10.50 × 6.82 m dining territory</text><text x="1325" y="105" font-size="16" text-anchor="end" font-weight="700" fill="#7e3f2c">OPT-002-R00</text></g><text x="70" y="120" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">A · RESEARCH BASIS</text><rect x="70" y="140" width="560" height="32" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="161" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">CAPACITY</text><text x="175" y="161" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">West Elm guidance: 120 in / 3.05 m rectangular table seats 12.</text><rect x="70" y="182" width="560" height="32" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="203" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">SEAT WIDTH</text><text x="175" y="203" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">West Elm + IKEA guidance: approximately 24 in / 0.61 m per diner.</text><rect x="70" y="224" width="560" height="32" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="245" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">PRODUCT</text><text x="175" y="245" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">Blakley 12-seat option: 120 × 39 or 45 in / 3.05 × 0.99 or 1.14 m.</text><rect x="70" y="266" width="560" height="32" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="287" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">CROSS-CHECK</text><text x="175" y="287" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">Pottery Barn Keaton: 120 × 52 in / 3.05 × 1.32 m seats 10–12.</text><rect x="70" y="308" width="560" height="32" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="329" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">CLEARANCE</text><text x="175" y="329" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">West Elm guidance: 36–44 in / 0.91–1.12 m table-to-wall chair zone.</text><text x="70" y="380" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">B · SELECTED COORDINATION ENVELOPE</text><rect x="70" y="400" width="560" height="32" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="86" y="421" font-size="7.2" text-anchor="start" font-weight="700" fill="#7d5528">TABLE</text><text x="175" y="421" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">3.20 × 1.10 × 0.75 m · rectangular · product not selected</text><rect x="70" y="442" width="560" height="32" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="86" y="463" font-size="7.2" text-anchor="start" font-weight="700" fill="#7d5528">CHAIRS</text><text x="175" y="463" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">5 per long side + 1 per head = 12 total</text><rect x="70" y="484" width="560" height="32" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="86" y="505" font-size="7.2" text-anchor="start" font-weight="700" fill="#7d5528">PERSON</text><text x="175" y="505" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">0.64 m nominal width per long-side chair</text><rect x="70" y="526" width="560" height="32" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="86" y="547" font-size="7.2" text-anchor="start" font-weight="700" fill="#7d5528">CLEAR ZONE</text><text x="175" y="547" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">1.10 m around the tabletop · symmetric 5.40 × 3.30 m envelope</text><rect x="70" y="568" width="560" height="32" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="86" y="589" font-size="7.2" text-anchor="start" font-weight="700" fill="#7d5528">CENTRE</text><text x="175" y="589" font-size="7" text-anchor="start" font-weight="400" fill="#35454b">X=26.25 m · Y=14.41 m · centre of the 10.50 × 6.82 m territory</text><text x="700" y="120" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">C · TRUE CENTRING IN THE SIDE B DINING TERRITORY</text><rect x="720" y="180" width="567.0" height="368.28000000000003" fill="#f7f4ee" stroke="#26363c" stroke-width="2"/><rect x="857.7" y="275.0400000000001" width="291.6" height="178.2" fill="#fff8e7" stroke="#aa7b31" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="917.0999999999999" y="334.44000000000005" width="172.8" height="59.400000000000006" fill="#d6b58b" stroke="#60492f" stroke-width="1.5" rx="4"/><text x="1003.5" y="368.14" font-size="8" text-anchor="middle" font-weight="700" fill="#243238">3.20 × 1.10 m</text><circle cx="934.3799999999999" cy="408.96000000000004" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="934.3799999999999" cy="319.3200000000001" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="968.9399999999999" cy="408.96000000000004" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="968.9399999999999" cy="319.3200000000001" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="1003.5" cy="408.96000000000004" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="1003.5" cy="319.3200000000001" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="1038.06" cy="408.96000000000004" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="1038.06" cy="319.3200000000001" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="1072.62" cy="408.96000000000004" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="1072.62" cy="319.3200000000001" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="901.9799999999998" cy="364.14" r="8" fill="#fbfaf6" stroke="#68767a"/><circle cx="1105.02" cy="364.14" r="8" fill="#fbfaf6" stroke="#68767a"/><line x1="1003.5" y1="180" x2="1003.5" y2="548.28" stroke="#a65f35" stroke-width="1" stroke-dasharray="6 4"/><line x1="720" y1="364.14" x2="1287.0" y2="364.14" stroke="#a65f35" stroke-width="1" stroke-dasharray="6 4"/><text x="1011.5" y="354.14" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">TRUE CENTRE · X=26.25 / Y=14.41</text><text x="1003.5" y="168" font-size="7" text-anchor="middle" font-weight="700" fill="#526168">SIDE B / LANDSCAPE SIDE</text><text x="1003.5" y="570.28" font-size="7" text-anchor="middle" font-weight="700" fill="#8a6518">CENTRAL PEDESTRIAN AXIS SIDE</text><text x="728" y="356.14" font-size="6.5" text-anchor="start" font-weight="700" fill="#7d5528">2.55 m beyond clear envelope</text><text x="1279.0" y="356.14" font-size="6.5" text-anchor="end" font-weight="700" fill="#7d5528">2.55 m</text><text x="1011.5" y="200" font-size="6.5" text-anchor="start" font-weight="700" fill="#7d5528">1.76 m beyond envelope</text><text x="1011.5" y="536.28" font-size="6.5" text-anchor="start" font-weight="700" fill="#7d5528">1.76 m</text><text x="700" y="615" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">D · ARCHITECTURAL RESULT</text><rect x="700" y="635" width="630" height="29" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="715" y="654" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">SCALE</text><text x="785" y="654" font-size="6.7" text-anchor="start" font-weight="400" fill="#35454b">3.20 m is generous for 12 without turning the table into a banquet object.</text><rect x="700" y="674" width="630" height="29" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="715" y="693" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">COMFORT</text><text x="785" y="693" font-size="6.7" text-anchor="start" font-weight="400" fill="#35454b">1.10 m depth supports shared dishes while keeping conversation and reach reasonable.</text><rect x="700" y="713" width="630" height="29" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="715" y="732" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">ORDER</text><text x="785" y="732" font-size="6.7" text-anchor="start" font-weight="400" fill="#35454b">The symmetric 5+5+2 arrangement makes the centre visually legible in the large hall.</text><rect x="700" y="752" width="630" height="29" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="715" y="771" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">LIGHT</text><text x="785" y="771" font-size="6.7" text-anchor="start" font-weight="400" fill="#35454b">Centre a linear pendant or pendant group on the final table, not on the room boundary.</text><rect x="700" y="791" width="630" height="29" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="715" y="810" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">HOLD</text><text x="785" y="810" font-size="6.7" text-anchor="start" font-weight="400" fill="#35454b">Real chair width, arms, table supports and product capacity govern procurement.</text><rect x="70" y="845" width="1260" height="35" fill="#fff4df" stroke="#bd5c3c" stroke-width="1"/><text x="88" y="867" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">OPTION STATUS</text><text x="190" y="867" font-size="6.8" text-anchor="start" font-weight="700" fill="#5a3a2c">b31 supersedes b30 for dining geometry only. PB b29 and D-071 remain active until the opposite-side dining move is formally adopted. Not for construction or procurement.</text></svg>