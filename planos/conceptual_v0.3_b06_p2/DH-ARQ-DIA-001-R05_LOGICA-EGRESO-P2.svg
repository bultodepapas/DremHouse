ke-width="1" rx="0"/><text x="569.5" y="233.60000000000002" font-family="Arial" font-size="7" font-weight="700" text-anchor="middle" fill="#233238">WELL</text><polyline points="275.20000000000005,573.5 364.29999999999995,384.5 421.0,330.5 523.5999999999999,392.6 556.0,392.6" fill="none" stroke="#b54332" stroke-width="4" marker-end="url(#a)"/><text x="730" y="175" font-family="Arial" font-size="13" font-weight="700" text-anchor="start" fill="#233238">LECTURA ARQUITECTÓNICA</text><text x="730" y="205" font-family="Arial" font-size="10" font-weight="400" text-anchor="start" fill="#233238">1. Llegada protegida y distribución sin balcón abierto.</text><text x="730" y="232" font-family="Arial" font-size="10" font-weight="400" text-anchor="start" fill="#233238">2. Suites con filtros; camas fuera de la visual directa del hall.</text><text x="730" y="259" font-family="Arial" font-size="10" font-weight="400" text-anchor="start" fill="#233238">3. F2 se aísla mediante una sola puerta y cierre continuo.</text><text x="730" y="286" font-family="Arial" font-size="10" font-weight="400" text-anchor="start" fill="#233238">4. Zona húmeda compacta; bajantes por coordinar con núcleo PB.</text><text x="730" y="325" font-family="Arial" font-size="13" font-weight="700" text-anchor="start" fill="#8e3328">ALERTA DE VIDA Y SEGURIDAD</text><text x="730" y="353" font-family="Arial" font-size="10" font-weight="700" text-anchor="start" fill="#233238">La flecha roja ilustra la única salida hoy representada.</text><text x="730" y="378" font-family="Arial" font-size="10" font-weight="400" text-anchor="start" fill="#233238">La segunda salida, distancias y resistencia al fuego siguen ABIERTAS.</text></svg>