on and replacement route</text><rect x="790" y="710" width="520" height="32" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="806" y="731" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">ENVELOPE</text><text x="885" y="731" font-size="7.2" text-anchor="start" font-weight="400" fill="#243238">Maintain insulation, vapour, air/water, fire and acoustic continuity</text><rect x="70" y="805" width="1260" height="75" fill="#fff4df" stroke="#bd5c3c" stroke-width="1"/><text x="88" y="830" font-size="9.5" text-anchor="start" font-weight="700" fill="#8e3825">FACADE HOLD</text><text x="220" y="830" font-size="7.5" text-anchor="start" font-weight="700" fill="#5a3a2c">The TV is on the hall wall, but unverified cladding rails or window framing may not carry its load. Design local independent backing and sealed penetrations.</text><text x="88" y="852" font-size="9.5" text-anchor="start" font-weight="700" fill="#8e3825">EQUIPMENT HOLD</text><text x="220" y="852" font-size="7.5" text-anchor="start" font-weight="700" fill="#5a3a2c">Confirm real TV mass, mount pattern, speakers, console equipment, cooling, access and replacement path before fabrication.</text><text x="88" y="873" font-size="9.5" text-anchor="start" font-weight="700" fill="#8e3825">VISUAL HOLD</text><text x="220" y="873" font-size="7.5" text-anchor="start" font-weight="700" fill="#5a3a2c">Validate Side B daylight and glare after site selection; keep the TV field solid and preserve workstation glazing at X=13.00–16.00 m.</text></svg>