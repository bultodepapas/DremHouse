<line x1="75" y1="600" x2="525.0" y2="600" stroke="#4f5c60" stroke-width="1.5"/><text x="75" y="627" font-size="6.8" text-anchor="start" font-weight="700" fill="#294f58">R1 model mechanics · R2 electronics ESD · R3 solder ESD + source extraction · R4 instruments ESD · R5 tools · R6 landing</text><text x="75" y="647" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">R2-R4: 0.80 m tops and manual +0.70-1.10 m adjustment · ESD common point bonds to protective earth · LiPo stays separate</text><text x="770" y="120" font-size="13" text-anchor="start" font-weight="700" fill="#243238">C · WALL / SILL / SERVICE PRINCIPLE</text><rect x="760" y="155" width="70" height="225" fill="#a2abad" stroke="#26363b" stroke-width="1.3"/><rect x="830" y="155" width="60" height="225" fill="#d8ded9" stroke="#536166" stroke-width="1"/><rect x="890" y="165" width="30" height="80.0" fill="#416771" stroke="#172126" stroke-width="2"/><rect x="882" y="245.0" width="46" height="12" fill="#29383d" stroke="#172126"/><line x1="940" y1="245.0" x2="1240" y2="245.0" stroke="#c99f6b" stroke-width="12"/><rect x="920" y="261.0" width="50" height="24" fill="#fff4df" stroke="#b56c31" stroke-width="1"/><text x="945" y="277.0" font-size="6.2" text-anchor="middle" font-weight="700" fill="#8e3825">30-50</text><text x="990" y="233.0" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">TOP / SILL ALIGN VISUALLY; DO NOT JOIN STRUCTURALLY</text><text x="990" y="267.0" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">removable shadow gap + service trough</text><text x="990" y="289.0" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">window drains and seals independently</text><text x="990" y="311.0" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">no furniture load to frame or facade girt</text><text x="760" y="405" font-size="7.5" text-anchor="start" font-weight="700" fill="#8e3825">HEIGHT DATUM</text><text x="855" y="405" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">+0.90 general · +0.84 heavy / large-object test · +0.70-1.10 adjustable electronics</text><text x="760" y="428" font-size="7.5" text-anchor="start" font-weight="700" fill="#8e3825">AUTHORITY</text><text x="855" y="428" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">Owner anthropometry, tasks and full-scale mock-ups govern final heights.</text><text x="70" y="700" font-size="13" text-anchor="start" font-weight="700" fill="#243238">D · CENTRAL RC TWO-SIDED ASSEMBLY ISLAND</text><rect x="75.0" y="725.0" width="414.0" height="147.20000000000002" fill="#d9d3c6" stroke="#526064" stroke-width="2"/><line x1="213.0" y1="725.0" x2="213.0" y2="872.2" stroke="#667579" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="351.0" y1="725.0" x2="351.0" y2="872.2" stroke="#667579" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="75.0" y1="798.6" x2="489.0" y2="798.6" stroke="#9d8c70" stroke-width="1" stroke-dasharray="4 3"/><text x="282.0" y="801.6" font-size="7.5" text-anchor="middle" font-weight="700" fill="#243238">4.50 × 1.60 m · 3 × 1.50 m · TWO-SIDED · TOP +0.84</text><text x="75" y="890" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">Flat replaceable light surface · central line is two 0.80 m reach halves · fixed versus lockable-mobile support remains open</text><text x="770" y="485" font-size="13" text-anchor="start" font-weight="700" fill="#243238">E · OPEN PROFESSIONAL GATES</text><rect x="770" y="515" width="555" height="34" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="784" y="536" font-size="6.6" text-anchor="start" font-weight="700" fill="#8e3825">1  Select real lift + vehicle; current 1.20 m car-bench strip overlaps the test envelope by 1.10 m.</text><rect x="770" y="559" width="555" height="34" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="784" y="580" font-size="6.6" text-anchor="start" font-weight="400" fill="#26363b">2  Mock up one 1.50 m car module and one adjustable RC module with the owner&#x27;s real work objects.</text><rect x="770" y="603" width="555" height="34" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="784" y="624" font-size="6.6" text-anchor="start" font-weight="400" fill="#26363b">3  Engineer bench frames, local vice/impact loads, drawer loads and bolted backing independently of the facade.</text><rect x="770" y="647" width="555" height="34" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="784" y="668" font-size="6.6" text-anchor="start" font-weight="400" fill="#26363b">4  Coordinate RETIE circuits/protective earth, ESD point, solder extraction, printer emissions and LiPo fire strategy.</text><rect x="770" y="691" width="555" height="34" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="784" y="712" font-size="6.6" text-anchor="start" font-weight="400" fill="#26363b">5  Quote local fixed and manual-adjustable modules; reconcile the unpriced 9.00 m RC wall bench before target change.</text><rect x="770" y="754" width="555" height="126" fill="#fff4df" stroke="#bd5c3c" stroke-width="1"/><text x="787" y="779" font-size="9" text-anchor="start" font-weight="700" fill="#8e3825">D-079 CONTROL</text><text x="787" y="803" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">Lengths and footprints remain schematic architectural reservations.</text><text x="787" y="825" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">Adjustability, loads, products, fire/extraction and electrical design remain open.</text><text x="787" y="847" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">Use imported systems only as benchmarks; price economical local modular fabrication.</text><text x="787" y="869" font-size="7.5" text-anchor="start" font-weight="700" fill="#8e3825">NOT FOR PROCUREMENT, FABRICATION OR CONSTRUCTION.</text></svg>