stroke="#a65f35" stroke-width="1" stroke-dasharray="6 4"/><line x1="745" y1="313.71500000000003" x2="1250.68" y2="313.71500000000003" stroke="#a65f35" stroke-width="1" stroke-dasharray="6 4"/><text x="1004.84" y="305.71500000000003" font-size="6.5" text-anchor="start" font-weight="700" fill="#8e3825">TARGET CENTRE</text><text x="751" y="183" font-size="6.2" text-anchor="start" font-weight="700" fill="#8a6518">Y=7.00 CENTRAL AXIS EDGE</text><text x="751" y="491.18" font-size="6.2" text-anchor="start" font-weight="700" fill="#526168">SIDE A / BENCH EDGE</text><text x="70" y="555" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">C · CENTRING SCHEDULE</text><rect x="70" y="578" width="610" height="28" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="597" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">USABLE TERRITORY</text><text x="210" y="597" font-size="6.8" text-anchor="start" font-weight="400" fill="#35454b">X=0.18–10.50 m · Y=0.93–7.00 m · centre X=5.34 / Y=3.965 m</text><rect x="70" y="615" width="610" height="28" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="634" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">LIFT ENVELOPE</text><text x="210" y="634" font-size="6.8" text-anchor="start" font-weight="400" fill="#35454b">X=2.14–8.54 m · Y=1.03–6.90 m · centre X=5.34 / Y=3.965 m</text><rect x="70" y="652" width="610" height="28" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="671" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">PROJECT CAR</text><text x="210" y="671" font-size="6.8" text-anchor="start" font-weight="400" fill="#35454b">4.80 × 2.00 m symbol · X=2.94–7.74 m · Y=2.965–4.965 m</text><rect x="70" y="689" width="610" height="28" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="708" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">POST PAIR</text><text x="210" y="708" font-size="6.8" text-anchor="start" font-weight="400" fill="#35454b">X=2.74 and 7.59 m · symmetric about X=5.34 m · Y centre=3.965 m</text><rect x="70" y="726" width="610" height="28" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="745" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">END RESIDUALS</text><text x="210" y="745" font-size="6.8" text-anchor="start" font-weight="400" fill="#35454b">1.96 m front + 1.96 m rear · exact longitudinal centring</text><rect x="70" y="763" width="610" height="28" fill="#f3efe8" stroke="#c3bcb1" stroke-width=".8"/><text x="86" y="782" font-size="7" text-anchor="start" font-weight="700" fill="#8e3825">SIDE RESIDUALS</text><text x="210" y="782" font-size="6.8" text-anchor="start" font-weight="400" fill="#35454b">0.10 m to bench + 0.10 m to central axis · exact transverse centring</text><text x="745" y="555" font-size="13" text-anchor="start" font-weight="700" fill="#26363c">D · ARCHITECTURAL READING</text><rect x="745" y="578" width="585" height="28" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="761" y="597" font-size="7" text-anchor="start" font-weight="700" fill="#7d5528">WHOLE GROUP</text><text x="855" y="597" font-size="6.5" text-anchor="start" font-weight="400" fill="#35454b">Car, posts and exclusion envelope now share one centre; this is not a cosmetic car-only move.</text><rect x="745" y="615" width="585" height="28" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="761" y="634" font-size="7" text-anchor="start" font-weight="700" fill="#7d5528">BENCH</text><text x="855" y="634" font-size="6.5" text-anchor="start" font-weight="400" fill="#35454b">The Side A bench is subtracted before judging the usable transverse centre.</text><rect x="745" y="652" width="585" height="28" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="761" y="671" font-size="7" text-anchor="start" font-weight="700" fill="#7d5528">AXIS</text><text x="855" y="671" font-size="6.5" text-anchor="start" font-weight="400" fill="#35454b">The Y=7.00 pedestrian axis stays visually and physically unobstructed.</text><rect x="745" y="689" width="585" height="28" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="761" y="708" font-size="7" text-anchor="start" font-weight="700" fill="#7d5528">MOVEMENT</text><text x="855" y="708" font-size="6.5" text-anchor="start" font-weight="400" fill="#35454b">Envelope +0.54 m X; car +0.69 m X and +0.815 m Y from the predecessor.</text><rect x="745" y="726" width="585" height="28" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="761" y="745" font-size="7" text-anchor="start" font-weight="700" fill="#7d5528">SAFETY</text><text x="855" y="745" font-size="6.5" text-anchor="start" font-weight="400" fill="#35454b">Graphic centring does not approve lift working clearances, door opening or egress.</text><rect x="745" y="763" width="585" height="28" fill="#f7eddd" stroke="#c7ad86" stroke-width=".8"/><text x="761" y="782" font-size="7" text-anchor="start" font-weight="700" fill="#7d5528">PRODUCT</text><text x="855" y="782" font-size="6.5" text-anchor="start" font-weight="400" fill="#35454b">Real car and lift data must replace every schematic rectangle before developed design.</text><rect x="70" y="845" width="1260" height="35" fill="#fff4df" stroke="#bd5c3c" stroke-width="1"/><text x="88" y="867" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">OPTION STATUS</text><text x="190" y="867" font-size="6.8" text-anchor="start" font-weight="700" fill="#5a3a2c">b32 supersedes b31 for project-car/lift position only. PB b29 remains the active published plan. Real equipment and manufacturer clearances remain mandatory. Not for construction.</text></svg>