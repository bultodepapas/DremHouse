<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1684" height="1191" viewBox="0 0 1684 1191" role="img" aria-labelledby="sheet-title sheet-description"><title id="sheet-title">Dream House owner-priority coordination details</title><desc id="sheet-description">PB laundry relocation, operable rear rescue window, wall-mounted vertical foldout escape-ladder reserve and large exposed edge-truss architectural brief.</desc><metadata>{&quot;construction_authority&quot;:false,&quot;drawing&quot;:&quot;DH-ARQ-DET-002-R25&quot;,&quot;life_safety_design_resolved&quot;:false,&quot;model_sha256&quot;:&quot;a40d87e07a86867a72e52eeff492f6db01ee55ae644773b785165ca2999bdbe6&quot;,&quot;revision&quot;:&quot;0.3-draft-28-P2&quot;,&quot;status&quot;:&quot;issued for D-083 modular near-floor-to-ceiling bedroom-window and daylight coordination; site, solar, privacy, structure, safe glazing, fall protection, operation, building physics, curtains and cost remain open; not for construction&quot;}</metadata><defs>
