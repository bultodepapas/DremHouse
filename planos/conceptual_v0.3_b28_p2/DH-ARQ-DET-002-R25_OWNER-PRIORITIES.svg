text><rect x="133.59999999999985" y="508.8" width="176.79999999999998" height="67.60000000000001" fill="#c7ddd8" stroke="#168aa3" stroke-width="2" class="pb-laundry-reserve"/><text x="221.99999999999983" y="523.8" font-size="7" text-anchor="middle" font-weight="700" fill="#1e6673" class="">W + D + SINK + TALL STORE</text><line x1="221.99999999999983" y1="576.4" x2="221.99999999999983" y2="632.4" stroke="#168aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="221.99999999999983" y="648.4" font-size="7.2" text-anchor="middle" font-weight="700" fill="#168aa3" class="">STACK BELOW PRIMARY WET BAND</text><text x="87.0" y="407.4" font-size="8" text-anchor="middle" font-weight="700" fill="#6f4e34" class="">GREAT WALL</text><text x="375" y="238" font-size="8.8" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="375" dy="0">Preferred location: inside the existing PB storage room.</tspan><tspan x="375" dy="13.640000000000002">The open hall remains free of a new enclosed box.</tspan><tspan x="375" dy="13.640000000000002">Laundry noise and visual clutter stay behind the flush Great Wall door.</tspan><tspan x="375" dy="13.640000000000002">The reserve aligns below the enlarged primary bathroom/service band.</tspan><tspan x="375" dy="13.640000000000002">Drainage, trap primer, ventilation, waterproofing and appliance access remain MEP tasks.</tspan></text><text x="830" y="166" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">02</text><text x="864" y="166" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">REAR RESCUE WINDOW + VERTICAL FOLDOUT ESCAPE LADDER</text><line x1="830" y1="177" x2="1610" y2="177" stroke="#c3ccce" stroke-width="1"/><text x="875" y="212" font-size="7.2" text-anchor="start" font-weight="700" fill="#168aa3" class="">REAR ELEVATION · STORED</text><rect x="865.0" y="230" width="295.0" height="380.0" fill="#eef0eb" stroke="#c3ccce" stroke-width="1.2" class="rear-facade-study"/><line x1="865.0" y1="610.0" x2="1160.0" y2="610.0" stroke="#172a33" stroke-width="2"/><line x1="865.0" y1="390.0" x2="1160.0" y2="390.0" stroke="#617078" stroke-width="1.2"/><text x="872" y="382.0" font-size="6.8" text-anchor="start" font-weight="700" fill="#617078" class="">P2 +3.80 m</text><rect x="935.0" y="268.42105263157896" width="57.89473684210532" height="69.4736842105263" fill="#d9f2f5" stroke="#168aa3" stroke-width="3" class="operable-rescue-window" data-opening-id="W-EGRESS-P2"/><line x1="935.0" y1="268.42105263157896" x2="992.8947368421053" y2="337.89473684210526" stroke="#168aa3" stroke-width="1"/><line x1="992.8947368421053" y1="268.42105263157896" x2="935.0" y2="337.89473684210526" stroke="#168aa3" stroke-width="1"/><text x="970" y="258.42105263157896" font-size="6.6" text-anchor="middle" font-weight="700" fill="#168aa3" class="">OPERABLE RESCUE WINDOW</text><line x1="1027.6315789473686" y1="248" x2="1027.6315789473686" y2="575.2631578947369" stroke="#172a33" stroke-width="6" class="foldout-ladder-fixed-rail"/><line x1="1030.1315789473686" y1="248" x2="1030.1315789473686" y2="575.2631578947369" stroke="#a63f31" stroke-width="2.5" class="foldout-ladder-stored-rail"/><rect x="1020.6315789473686" y="318" width="14" height="14" fill="#f5ded8" stroke="#a63f31" stroke-width="1.5" class="top-release"/><line x1="992.8947368421053" y1="326" x2="1019.6315789473686" y2="326" stroke="#a63f31" stroke-width="1.4" stroke-dasharray="4 3"/><text x="1010.2631578947369" y="313" font-size="6.2" text-anchor="middle" font-weight="700" fill="#a63f31" class="">TOP RELEASE</text><line x1="992.8947368421053" y1="355" x2="1027.6315789473686" y2="355" stroke="#168aa3" stroke-width="1.4"/><text x="1010.2631578947369" y="371" font-size="6.2" text-anchor="middle" font-weight="700" fill="#168aa3" class="">0.60 m JAMB OFFSET</text><text x="1039.6315789473686" y="548" font-size="6.2" text-anchor="start" font-weight="700" fill="#a63f31" class="">~0.10 m</text><text x="1039.6315789473686" y="561" font-size="6.2" text-anchor="start" font-weight="700" fill="#a63f31" class="">CLOSED PROFILE</text><text x="1205" y="212" font-size="7.2" text-anchor="start" font-weight="700" fill="#168aa3" class="">TRANSVERSE SECTION · DEPLOYED</text><line x1="1185" y1="610.0" x2="1510" y2="610.0" stroke="#172a33" stroke-width="2"/><line x1="1265.0" y1="230" x2="1265.0" y2="610.0" stroke="#172a33" stroke-width="7"/><line x1="1195" y1="390.0" x2="1265.0" y2="390.0" stroke="#617078" stroke-width="1.2"/><line x1="1270.7894736842106" y1="248" x2="1270.7894736842106" y2="575.2631578947369" stroke="#172a33" stroke-width="6" class="foldout-ladder-fixed-rail"/><line x1="1305.5263157894738" y1="248" x2="1305.5263157894738" y2="575.2631578947369" stroke="#168aa3" stroke-width="6" class="foldout-ladder-mobile-rail"/><line x1="1267.0" y1="315" x2="1270.7894736842106" y2="315" stroke="#a63f31" stroke-width="2" class="top-release"/><text x="1332" y="264" font-size="6.5" text-anchor="start" font-weight="700" fill="#168aa3" class="">OUTWARD</text><text x="1332" y="277" font-size="6.5" text-anchor="start" font-weight="700" fill="#168aa3" class="">CONTROLLED</text><text x="1332" y="290" font-size="6.5" text-anchor="start" font-weight="700" fill="#168aa3" class="">GRAVITY-ASSIST</text><path d="M 1278.8 300 Q 1317.5 320 1319.5 375" fill="none" stroke="#168aa3" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#route-arrow)" class="deployment-motion"/><line x1="1267.0" y1="268.42105263157896" x2="1267.0" y2="337.89473684210526" stroke="#f6f3ec" stroke-width="9" class="rescue-window-section"/><text x="1200" y="305.1578947368421" font-size="6.2" text-anchor="start" font-weight="700" fill="#168aa3" class="">WINDOW</text><line x1="1325.5263157894738" y1="575.2631578947369" x2="1325.5263157894738" y2="610.0" stroke="#a63f31" stroke-width="1.2"/><line x1="1318.5263157894738" y1="575.2631578947369" x2="1332.5263157894738" y2="575.2631578947369" stroke="#a63f31" stroke-width="1.2"/><line x1="1318.5263157894738" y1="610.0" x2="1332.5263157894738" y2="610.0" stroke="#a63f31" stroke-width="1.2"/><text x="1339.5263157894738" y="596" font-size="6.2" text-anchor="start" font-weight="700" fill="#a63f31" class="">0.60 m</text><rect x="1265.0" y="224" width="46.31578947368422" height="366.2631578947369" fill="none" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="7 4" class="clear-ladder-envelope"/><line x1="1270.7894736842106" y1="366.8421052631579" x2="1305.5263157894738" y2="366.8421052631579" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="384.2105263157895" x2="1305.5263157894738" y2="384.2105263157895" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="401.5789473684211" x2="1305.5263157894738" y2="401.5789473684211" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="418.94736842105266" x2="1305.5263157894738" y2="418.94736842105266" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="436.3157894736842" x2="1305.5263157894738" y2="436.3157894736842" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="453.68421052631584" x2="1305.5263157894738" y2="453.68421052631584" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="471.0526315789474" x2="1305.5263157894738" y2="471.0526315789474" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="488.42105263157896" x2="1305.5263157894738" y2="488.42105263157896" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="505.7894736842105" x2="1305.5263157894738" y2="505.7894736842105" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="523.1578947368421" x2="1305.5263157894738" y2="523.1578947368421" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="540.5263157894738" x2="1305.5263157894738" y2="540.5263157894738" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="557.8947368421053" x2="1305.5263157894738" y2="557.8947368421053" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><line x1="1270.7894736842106" y1="575.2631578947369" x2="1305.5263157894738" y2="575.2631578947369" stroke="#168aa3" stroke-width="2" class="foldout-ladder-rung"/><text x="845" y="652" font-size="8.1" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="845" dy="0">Fixed inner rail anchors to verified structure; the outer rail descends and the rungs rotate 90 degrees.</tspan><tspan x="845" dy="11.745">Release is reachable only from the served window, without a key; no ground-level operating handle.</tspan><tspan x="845" dy="11.745">Keep the 0.80 x 0.80 m deployment zone, facade structure, wiring, drainage and grade unobstructed.</tspan><tspan x="845" dy="11.745">Supplementary escape/rescue device only: CF-012 and professional fire approval remain open.</tspan></text><text x="70" y="790" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">03</text><text x="104" y="790" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">X=21 EDGE · EXPOSED TRUSS + OPEN FAMILY BALCONY</text><line x1="70" y1="801" x2="850" y2="801" stroke="#c3ccce" stroke-width="1"/><line x1="105.0" y1="845.0" x2="740.0" y2="845.0" stroke="#172a33" stroke-width="9"/><line x1="105.0" y1="965.0" x2="740.0" y2="965.0" stroke="#172a33" stroke-width="9"/><line x1="105.0" y1="957.0" x2="740.0" y2="957.0" stroke="#bd7626" stroke-width="4" stroke-dasharray="12 5"/><text x="422.5" y="867.0" font-size="7.2" text-anchor="middle" font-weight="700" fill="#bd7626" class="">OPEN FAMILY BALCONY · CONTINUOUS GUARD</text><line x1="105.0" y1="965.0" x2="210.83333333333331" y2="845.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="210.83333333333331" y1="845.0" x2="316.66666666666663" y2="965.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="316.66666666666663" y1="965.0" x2="422.5" y2="845.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="422.5" y1="845.0" x2="528.3333333333333" y2="965.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="528.3333333333333" y1="965.0" x2="634.1666666666666" y2="845.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="634.1666666666666" y1="845.0" x2="740.0" y2="965.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><rect x="240.0" y="983.0" width="360" height="48" fill="#e6d5b9" stroke="#bd7626" stroke-width="1.5"/><text x="420.0" y="1012.0" font-size="8.5" text-anchor="middle" font-weight="700" fill="#bd7626" class="">MINI-DECK VIEW CONE KEPT CLEAR</text><text x="805" y="846" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">ARCHITECTURAL BRIEF</text><text x="805" y="875" font-size="9.1" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="805" dy="0">A visible truss is acceptable—and desirable—when it reads as one large,</tspan><tspan x="805" dy="13.194999999999999">deep, load-bearing industrial object. Small decorative trusses are rejected.</tspan><tspan x="805" dy="13.194999999999999">The open family-balcony view remains primary; member topology, depth, joints, fire</tspan><tspan x="805" dy="13.194999999999999">protection, vibration and services still require structural coordination.</tspan><tspan x="805" dy="13.194999999999999">D-063: coordinate the 7.45 m guard, edge beam and smoke/noise transfer.</tspan></text><rect x="36" y="1060" width="1612" height="106" fill="#172a33"/><rect x="36" y="1060" width="1612" height="7" fill="#168aa3"/><text x="56" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">CONTROLLED OUTCOME</text><text x="56" y="1120" font-size="13" text-anchor="start" font-weight="700" fill="#ffffff" class="">D-083 · MODULAR NEAR-FLOOR-TO-CEILING BEDROOM WINDOWS · DAYLIGHT COORDINATION</text><text x="56" y="1145" font-size="7.8" text-anchor="start" font-weight="400" fill="#d3dfe2" class="">Current architectural coordination hypothesis. It does not authorize procurement, fabrication or construction.</text><line x1="1160" y1="1067" x2="1160" y2="1166" stroke="#536970" stroke-width="1"/><text x="1180" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">SHEET</text><text x="1180" y="1121" font-size="15" text-anchor="start" font-weight="700" fill="#ffffff" class="">DH-ARQ-DET-002-R25</text><text x="1180" y="1146" font-size="7.5" text-anchor="start" font-weight="400" fill="#c9d8dc" class="">R25 · 2026-08-21 · SHA a40d87e07a8686...</text><line x1="1450" y1="1067" x2="1450" y2="1166" stroke="#536970" stroke-width="1"/><text x="1470" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">STATUS</text><text x="1470" y="1120" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">NOT FOR</text><text x="1470" y="1141" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">CONSTRUCTION</text></svg>
