/><rect x="319.8" y="613.5999999999999" width="37.800000000000004" height="28.8" fill="#424f54" stroke="#263238"/><text x="338.7" y="629.8000000000001" font-size="7" text-anchor="middle" font-weight="700" fill="#fff">rack</text><rect x="390.0" y="613.5999999999999" width="45.0" height="61.199999999999996" fill="#e2e7e4" stroke="#59686d"/><text x="412.5" y="644.1999999999999" font-size="6" text-anchor="middle" font-weight="700" fill="#243238">UPS / tableros</text><line x1="300" y1="140.2" x2="300" y2="172.6" stroke="#9d4a2f" stroke-width="5"/><line x1="300" y1="251.79999999999998" x2="300" y2="284.2" stroke="#9d4a2f" stroke-width="5"/><line x1="300" y1="410.20000000000005" x2="300" y2="446.20000000000005" stroke="#9d4a2f" stroke-width="5"/><line x1="300" y1="521.8" x2="300" y2="554.1999999999999" stroke="#9d4a2f" stroke-width="5"/><line x1="300" y1="626.2" x2="300" y2="658.6" stroke="#9d4a2f" stroke-width="5"/><line x1="462.0" y1="250.0" x2="462.0" y2="286.0" stroke="#236a45" stroke-width="6"/><line x1="462.0" y1="408.40000000000003" x2="462.0" y2="444.40000000000003" stroke="#236a45" stroke-width="6"/><text x="570" y="130" font-size="14" text-anchor="start" font-weight="700" fill="#6c452e">CAPAS DE ESTUDIO</text><rect x="570" y="155" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="176" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">01</text><text x="622" y="176" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Gran muro: 0,20 m total conceptual; subestructura, absorbente y acabado listonado registrable.</text><rect x="570" y="218" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="239" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">02</text><text x="622" y="239" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Particiones estándar: 0,15 m con desempeño acústico por definir.</text><rect x="570" y="281" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="302" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">03</text><text x="622" y="302" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Escalera: cerramientos de 0,20 m y descarga posterior; resistencia al fuego pendiente.</text><rect x="570" y="344" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="365" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">04</text><text x="622" y="365" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Envolvente posterior: 0,18 m conceptual de panel aislado; puentes térmicos y reacción al fuego pendientes.</text><rect x="570" y="407" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="428" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">05</text><text x="622" y="428" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Profundidad libre resultante del núcleo: ≈4,12 m antes de trasdosados/equipos.</text><rect x="570" y="470" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="491" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">06</text><text x="622" y="491" font-size="8" text-anchor="start" font-weight="400" fill="#243238">No mezclar drenajes ni agua sobre rack/UPS; coordinar bandejas, detección, ventilación y acceso posterior.</text><rect x="570" y="533" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="554" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">07</text><text x="622" y="554" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Bodega y homelab quedan separados por escalera y baño; pantry queda contiguo a cocina.</text><rect x="570" y="596" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="617" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">08</text><text x="622" y="617" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Todas las áreas netas son aproximadas y se recalculan después de estructura y especificaciones.</text><rect x="570" y="690" width="720" height="125" fill="#fff4df" stroke="#bd5c3c"/><text x="588" y="718" font-size="12" text-anchor="start" font-weight="700" fill="#8e3825">COORDINACIONES BLOQUEANTES</text><text x="592" y="742" font-size="8" text-anchor="start" font-weight="400" fill="#3f4c51">• huella/contrahuella/gálibo y puertas de escalera</text><text x="592" y="757" font-size="8" text-anchor="start" font-weight="400" fill="#3f4c51">• extracción y aire de reposición del baño/homelab</text><text x="592" y="772" font-size="8" text-anchor="start" font-weight="400" fill="#3f4c51">• rutas hidráulicas y sanitarias hacia P2</text><text x="592" y="787" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">• protección contra incendio y segunda salida</text><text x="592" y="802" font-size="8" text-anchor="start" font-weight="400" fill="#3f4c51">• equipos reales, registros y radios de mantenimiento</text></svg>