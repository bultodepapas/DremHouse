<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1684" height="1191" viewBox="0 0 1684 1191" role="img" aria-labelledby="sheet-title sheet-description"><title id="sheet-title">Dream House owner-priority coordination details</title><desc id="sheet-description">PB laundry relocation, retractable exterior stair reserve and large exposed edge-truss architectural brief.</desc><metadata>{&quot;construction_authority&quot;:false,&quot;drawing&quot;:&quot;DH-ARQ-DET-002-R17&quot;,&quot;life_safety_design_resolved&quot;:false,&quot;model_sha256&quot;:&quot;36e23993298626c22feffa7fb2c93e72dc085c454a13ebae2ccbbdd6ea8292b8&quot;,&quot;revision&quot;:&quot;0.3-draft-20-P2&quot;,&quot;status&quot;:&quot;issued for coordination under D-064; main-plan phasing overlay suppressed for visual clarity; not for construction&quot;}</metadata><defs>
