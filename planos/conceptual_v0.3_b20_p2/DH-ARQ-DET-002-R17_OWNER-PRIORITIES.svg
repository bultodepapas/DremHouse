        </defs><rect x="0" y="0" width="1684" height="1191" fill="#f6f3ec"/><rect x="0" y="0" width="1684" height="112" fill="#172a33"/><rect x="0" y="112" width="1684" height="6" fill="#168aa3"/><text x="52" y="45" font-size="9" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">DREAM HOUSE · BOYACA, COLOMBIA</text><text x="52" y="80" font-size="23" text-anchor="start" font-weight="700" fill="#ffffff" class="">OWNER PRIORITIES · ARCHITECTURAL INTERFACES</text><text x="1040" y="48" font-size="15" text-anchor="end" font-weight="700" fill="#ffffff" class="">DH-ARQ-DET-002-R17</text><text x="1040" y="76" font-size="8.5" text-anchor="end" font-weight="400" fill="#c9d8dc" class="">PB laundry + retractable stair + open family balcony at exposed truss</text><text x="1618" y="48" font-size="17" text-anchor="end" font-weight="700" fill="#ffffff" class="">R17</text><text x="1618" y="75" font-size="8.5" text-anchor="end" font-weight="400" fill="#c9d8dc" class="">0.3-draft-20-P2</text><text x="70" y="166" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">01</text><text x="104" y="166" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">PB LAUNDRY BEHIND THE GREAT WALL</text><line x1="70" y1="177" x2="850" y2="177" stroke="#c3ccce" stroke-width="1"/><rect x="105.0" y="215.0" width="234.0" height="384.8" fill="#eef0eb" stroke="#172a33" stroke-width="2"/><rect x="105.0" y="215.0" width="10.4" height="384.8" fill="#b88c64" stroke="#6f4e34" stroke-width="1.2"/><rect x="115.4" y="215.0" width="223.6" height="124.8" fill="#e5dcc7" stroke="#617078" stroke-width="1"/><rect x="115.4" y="339.8" width="223.6" height="260.0" fill="#dce2dc" stroke="#617078" stroke-width="1"/><text x="222.0" y="277.4" font-size="8" text-anchor="middle" font-weight="700" fill="#172a33" class="">PANTRY / CLEAN SUPPORT</text><text x="222.0" y="371.0" font-size="8" text-anchor="middle" font-weight="700" fill="#172a33" class="">STORAGE + CONCEALED LAUNDRY</text><rect x="133.59999999999985" y="508.8" width="176.79999999999998" height="67.60000000000001" fill="#c7ddd8" stroke="#168aa3" stroke-width="2" class="pb-laundry-reserve"/><text x="221.99999999999983" y="523.8" font-size="7" text-anchor="middle" font-weight="700" fill="#1e6673" class="">W + D + SINK + TALL STORE</text><line x1="221.99999999999983" y1="576.4" x2="221.99999999999983" y2="632.4" stroke="#168aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="221.99999999999983" y="648.4" font-size="7.2" text-anchor="middle" font-weight="700" fill="#168aa3" class="">STACK BELOW PRIMARY WET BAND</text><text x="87.0" y="407.4" font-size="8" text-anchor="middle" font-weight="700" fill="#6f4e34" class="">GREAT WALL</text><text x="375" y="238" font-size="8.8" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="375" dy="0">Preferred location: inside the existing PB storage room.</tspan><tspan x="375" dy="13.640000000000002">The open hall remains free of a new enclosed box.</tspan><tspan x="375" dy="13.640000000000002">Laundry noise and visual clutter stay behind the flush Great Wall door.</tspan><tspan x="375" dy="13.640000000000002">The reserve aligns below the enlarged primary bathroom/service band.</tspan><tspan x="375" dy="13.640000000000002">Drainage, trap primer, ventilation, waterproofing and appliance access remain MEP tasks.</tspan></text><text x="830" y="166" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">02</text><text x="864" y="166" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">REAR RETRACTABLE EXTERIOR STAIR RESERVE</text><line x1="830" y1="177" x2="1610" y2="177" stroke="#c3ccce" stroke-width="1"/><line x1="870" y1="610.0" x2="1510" y2="610.0" stroke="#172a33" stroke-width="2"/><line x1="1020.0" y1="220" x2="1020.0" y2="610.0" stroke="#172a33" stroke-width="6"/><rect x="1012.0" y="309.0" width="16" height="56" fill="#f5ded8" stroke="#a63f31" stroke-width="2" class="egress-door"/><line x1="1020.0" y1="365.0" x2="1130" y2="365.0" stroke="#a63f31" stroke-width="5"/><text x="1075" y="353.0" font-size="7.5" text-anchor="middle" font-weight="700" fill="#a63f31" class="">P2 LANDING</text><line x1="1130" y1="365.0" x2="1210" y2="465" stroke="#a63f31" stroke-width="7" class="retracted-stair"/><line x1="1210" y1="465" x2="1125" y2="520" stroke="#a63f31" stroke-width="7" class="retracted-stair"/><text x="1218" y="493" font-size="8" text-anchor="start" font-weight="700" fill="#a63f31" class="">RETRACTED</text><text x="1218" y="508" font-size="7" text-anchor="start" font-weight="700" fill="#a63f31" class="">LOWER END ABOVE GRADE</text><line x1="1130" y1="365.0" x2="1450" y2="610.0" stroke="#168aa3" stroke-width="3" stroke-dasharray="10 6" class="deployed-stair"/><line x1="1100" y1="371.0" x2="1420" y2="616.0" stroke="#168aa3" stroke-width="3" stroke-dasharray="10 6" class="deployed-stair"/><text x="1380" y="555" font-size="8" text-anchor="middle" font-weight="700" fill="#168aa3" class="">DEPLOYED STUDY POSITION</text><line x1="1140" y1="379.0" x2="1164" y2="381.0" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="1174" y1="404.5" x2="1198" y2="406.5" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="1208" y1="430.0" x2="1232" y2="432.0" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="1242" y1="455.5" x2="1266" y2="457.5" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="1276" y1="481.0" x2="1300" y2="483.0" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="1310" y1="506.5" x2="1334" y2="508.5" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="1344" y1="532.0" x2="1368" y2="534.0" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="1378" y1="557.5" x2="1402" y2="559.5" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="1412" y1="583.0" x2="1436" y2="585.0" stroke="#168aa3" stroke-width="1.2" stroke-dasharray="5 3"/><text x="845" y="655" font-size="8.4" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="845" dy="0">Security intent: the lower flight does not touch grade while stored.</tspan><tspan x="845" dy="12.18">Access is directly from the dry wellness threshold.</tspan><tspan x="845" dy="12.18">Required study: counterbalanced/manual fail-safe deployment without a key from inside.</tspan><tspan x="845" dy="12.18">Do not count as a compliant second exit until fire, egress, accessibility and rescue review.</tspan></text><text x="70" y="790" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">03</text><text x="104" y="790" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">X=21 EDGE · EXPOSED TRUSS + OPEN FAMILY BALCONY</text><line x1="70" y1="801" x2="850" y2="801" stroke="#c3ccce" stroke-width="1"/><line x1="105.0" y1="845.0" x2="740.0" y2="845.0" stroke="#172a33" stroke-width="9"/><line x1="105.0" y1="965.0" x2="740.0" y2="965.0" stroke="#172a33" stroke-width="9"/><line x1="105.0" y1="957.0" x2="740.0" y2="957.0" stroke="#bd7626" stroke-width="4" stroke-dasharray="12 5"/><text x="422.5" y="867.0" font-size="7.2" text-anchor="middle" font-weight="700" fill="#bd7626" class="">OPEN FAMILY BALCONY · CONTINUOUS GUARD</text><line x1="105.0" y1="965.0" x2="210.83333333333331" y2="845.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="210.83333333333331" y1="845.0" x2="316.66666666666663" y2="965.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="316.66666666666663" y1="965.0" x2="422.5" y2="845.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="422.5" y1="845.0" x2="528.3333333333333" y2="965.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="528.3333333333333" y1="965.0" x2="634.1666666666666" y2="845.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><line x1="634.1666666666666" y1="845.0" x2="740.0" y2="965.0" stroke="#4d626a" stroke-width="6" class="large-exposed-truss-web"/><rect x="240.0" y="983.0" width="360" height="48" fill="#e6d5b9" stroke="#bd7626" stroke-width="1.5"/><text x="420.0" y="1012.0" font-size="8.5" text-anchor="middle" font-weight="700" fill="#bd7626" class="">MINI-DECK VIEW CONE KEPT CLEAR</text><text x="805" y="846" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">ARCHITECTURAL BRIEF</text><text x="805" y="875" font-size="9.1" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="805" dy="0">A visible truss is acceptable—and desirable—when it reads as one large,</tspan><tspan x="805" dy="13.194999999999999">deep, load-bearing industrial object. Small decorative trusses are rejected.</tspan><tspan x="805" dy="13.194999999999999">The open family-balcony view remains primary; member topology, depth, joints, fire</tspan><tspan x="805" dy="13.194999999999999">protection, vibration and services still require structural coordination.</tspan><tspan x="805" dy="13.194999999999999">D-063: coordinate the 7.45 m guard, edge beam and smoke/noise transfer.</tspan></text><rect x="36" y="1060" width="1612" height="106" fill="#172a33"/><rect x="36" y="1060" width="1612" height="7" fill="#168aa3"/><text x="56" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">CONTROLLED OUTCOME</text><text x="56" y="1120" font-size="13" text-anchor="start" font-weight="700" fill="#ffffff" class="">D-059 · REFINED DOUBLE-FRAME P2 EXTERIOR ENVELOPE · DESIGN COORDINATION</text><text x="56" y="1145" font-size="7.8" text-anchor="start" font-weight="400" fill="#d3dfe2" class="">Current architectural coordination hypothesis. It does not authorize procurement, fabrication or construction.</text><line x1="1160" y1="1067" x2="1160" y2="1166" stroke="#536970" stroke-width="1"/><text x="1180" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">SHEET</text><text x="1180" y="1121" font-size="15" text-anchor="start" font-weight="700" fill="#ffffff" class="">DH-ARQ-DET-002-R17</text><text x="1180" y="1146" font-size="7.5" text-anchor="start" font-weight="400" fill="#c9d8dc" class="">R17 · 2026-08-18 · SHA 36e23993298626...</text><line x1="1450" y1="1067" x2="1450" y2="1166" stroke="#536970" stroke-width="1"/><text x="1470" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">STATUS</text><text x="1470" y="1120" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">NOT FOR</text><text x="1470" y="1141" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">CONSTRUCTION</text></svg>
