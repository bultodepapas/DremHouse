itacional. HSS150x150x8 y IPE400 solo demuestran cabida; envolvente de muro 0,25–0,35 m.</text><text x="145" y="860" font-size="8.5" text-anchor="start" font-weight="700" fill="#8e3825">Sin pandeo, uniones, anclajes, fuego, cimentación ni función lateral. Las puertas y el portal de escalera permanecen libres.</text></g></svg>