l="#3f4c51">• Cero columnas interiores en los tres esquemas; el gran muro además aporta rigidez lateral longitudinal (wind girder simplificado).</text><text x="90" y="896" font-size="8.5" text-anchor="start" font-weight="700" fill="#8e3825">• NO APTO PARA CONSTRUIR · hipótesis de esquema para inspección visual, no diseño profesional.</text></svg>