 de subtotal; NO tiene análisis lateral, estabilidad de barras ni conexiones.</text><text x="90" y="838" font-size="8.5" text-anchor="start" font-weight="400" fill="#3f4c51">• GRAN-MURO D-043: apoyo gravitacional híbrido activo; HSS150x150x8 ocultas + IPE400 son pruebas de cabida, no perfiles seleccionados.</text><text x="90" y="854" font-size="8.5" text-anchor="start" font-weight="400" fill="#3f4c51">• STAGGERED/DECK: alternativas no adoptadas; panel compuesto, vibración, diafragma y fuego no analizados.</text><text x="90" y="870" font-size="8.5" text-anchor="start" font-weight="700" fill="#8e3825">• D-043 FIJA EL CAMINO GRAVITACIONAL, NO EL TONELAJE. NO APTO PARA PRESUPUESTAR, FABRICAR O CONSTRUIR.</text></svg>