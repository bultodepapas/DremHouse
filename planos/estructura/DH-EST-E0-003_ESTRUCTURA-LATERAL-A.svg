ght="400" fill="#3f4c51">• Modelo E0 · M60 · CERCHA: marcos 16.7 t · columnas HEA200 · cuerda IPE220. Entrepiso P2: metaldeck 9.6 t (con columnas) · staggered 3.8 t · GRAN-MURO 6.1 t.</text><text x="90" y="854" font-size="8.5" text-anchor="start" font-weight="400" fill="#3f4c51">• GRAN-MURO (preferido): 3 vigas longitudinales IPE450 de 10.5 m en el plenum (Y≈3/9/15) + cercha de borde X=21 (luz 18 m, cordón HSS150x150x8) + gran muro portante (axial ≈ 76.4 kN/m, núcleo de corte) + franja núcleo sobre el muro (luz 4.5 m). fn del panel ≈ 10.4 Hz. Total estimado con GRAN-MURO ≈ 30.3 t.</text><text x="90" y="868" font-size="8.5" text-anchor="start" font-weight="400" fill="#3f4c51">• Staggered (alternativa): 3 cerchas de 18 m, canto 3.0 m (d/L 0.167), paneles 5.0 m sin viguetas, fn ≈ 14.9 Hz — exige re-articular particiones.</text><text x="90" y="882" font-size="8.5" text-anchor="start" font-weight="400" fill="#3f4c51">• Cero columnas interiores en los tres esquemas; el gran muro además aporta rigidez lateral longitudinal (wind girder simplificado).</text><text x="90" y="896" font-size="8.5" text-anchor="start" font-weight="700" fill="#8e3825">• NO APTO PARA CONSTRUIR · hipótesis de esquema para inspección visual, no diseño profesional.</text></svg>