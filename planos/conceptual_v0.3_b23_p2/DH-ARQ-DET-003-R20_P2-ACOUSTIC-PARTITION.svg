0.65" class="glass-wool-infill"/><line x1="778.2" y1="268.0" x2="792.2" y2="502.0" stroke="#2e7252" stroke-width="1.1" opacity="0.65" class="glass-wool-infill"/><line x1="798.2" y1="268.0" x2="812.2" y2="502.0" stroke="#2e7252" stroke-width="1.1" opacity="0.65" class="glass-wool-infill"/><line x1="818.2" y1="268.0" x2="822.2" y2="502.0" stroke="#2e7252" stroke-width="1.1" opacity="0.65" class="glass-wool-infill"/><rect x="826.2" y="260.0" width="38.099999999999994" height="250.0" fill="#d7d2c8" stroke="#172a33" stroke-width="1.2" class="wall-layer reclaimed-gypsum-board"/><rect x="864.3000000000001" y="260.0" width="38.099999999999994" height="250.0" fill="#f7f5ef" stroke="#172a33" stroke-width="1.2" class="wall-layer new-gypsum-board"/><line x1="150.0" y1="224" x2="902.4000000000001" y2="224" stroke="#168aa3" stroke-width="1.8"/><line x1="150.0" y1="215" x2="150.0" y2="233" stroke="#168aa3" stroke-width="1.8"/><line x1="902.4000000000001" y1="215" x2="902.4000000000001" y2="233" stroke="#168aa3" stroke-width="1.8"/><text x="526.2" y="210" font-size="10" text-anchor="middle" font-weight="700" fill="#168aa3" class="">250 mm NOMINAL · 250.8 mm ILLUSTRATIVE LAYER SUM</text><text x="120.0" y="385.0" font-size="9" text-anchor="end" font-weight="700" fill="#172a33" class="">ROOM A</text><text x="932.4000000000001" y="385.0" font-size="9" text-anchor="start" font-weight="700" fill="#172a33" class="">ROOM B</text><line x1="169.05" y1="510.0" x2="169.05" y2="546" stroke="#617078" stroke-width="0.9"/><text x="169.05" y="560" font-size="7.0" text-anchor="middle" font-weight="700" fill="#172a33" class="">12.7 NEW FINISH BOARD</text><line x1="207.14999999999998" y1="510.0" x2="207.14999999999998" y2="586" stroke="#617078" stroke-width="0.9"/><text x="207.14999999999998" y="600" font-size="7.0" text-anchor="middle" font-weight="700" fill="#172a33" class="">12.7 RECLAIMED BOARD · CONCEALED</text><line x1="316.2" y1="510.0" x2="316.2" y2="626" stroke="#617078" stroke-width="0.9"/><text x="316.2" y="640" font-size="7.0" text-anchor="middle" font-weight="700" fill="#172a33" class="">60 FRAME + 50 GLASS WOOL</text><line x1="526.2" y1="510.0" x2="526.2" y2="666" stroke="#617078" stroke-width="0.9"/><text x="526.2" y="680" font-size="7.0" text-anchor="middle" font-weight="700" fill="#172a33" class="">80 CLEAR DECOUPLING CAVITY</text><line x1="736.2" y1="510.0" x2="736.2" y2="706" stroke="#617078" stroke-width="0.9"/><text x="736.2" y="720" font-size="7.0" text-anchor="middle" font-weight="700" fill="#172a33" class="">60 FRAME + 50 GLASS WOOL</text><line x1="845.25" y1="510.0" x2="845.25" y2="746" stroke="#617078" stroke-width="0.9"/><text x="845.25" y="760" font-size="7.0" text-anchor="middle" font-weight="700" fill="#172a33" class="">12.7 RECLAIMED BOARD · CONCEALED</text><line x1="883.35" y1="510.0" x2="883.35" y2="786" stroke="#617078" stroke-width="0.9"/><text x="883.35" y="800" font-size="7.0" text-anchor="middle" font-weight="700" fill="#172a33" class="">12.7 NEW FINISH BOARD</text><text x="1010" y="165" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">02</text><text x="1044" y="165" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">WHY THIS IS THE ECONOMICAL BASE</text><line x1="1010" y1="176" x2="1648" y2="176" stroke="#c3ccce" stroke-width="1"/><text x="1010" y="205" font-size="8.7" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="1010" dy="0">Two independent frames provide the primary decoupling.</tspan><tspan x="1010" dy="13.745999999999999">Glass wool fills each frame; the central cavity stays clear.</tspan><tspan x="1010" dy="13.745999999999999">Reclaimed board adds concealed mass where appearance is irrelevant.</tspan><tspan x="1010" dy="13.745999999999999">New outer boards provide the durable visible finish.</tspan><tspan x="1010" dy="13.745999999999999">No third gypsum leaf is placed in the centre cavity.</tspan><tspan x="1010" dy="13.745999999999999">P2-W04 uses this build-up only in its opaque portions.</tspan></text><text x="1010" y="405" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">03</text><text x="1044" y="405" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">RECLAIMED-BOARD ACCEPTANCE</text><line x1="1010" y1="416" x2="1648" y2="416" stroke="#c3ccce" stroke-width="1"/><text x="1010" y="445" font-size="8.4" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="1010" dy="0">Concealed layer only; never the visible finish.</tspan><tspan x="1010" dy="13.020000000000001">Accept only dry, clean, sound sheets without mould or delamination.</tspan><tspan x="1010" dy="13.020000000000001">Confirm fastener holding on a site sample before installation.</tspan><tspan x="1010" dy="13.020000000000001">Stagger joints from the finish layer and seal the perimeter.</tspan><tspan x="1010" dy="13.020000000000001">Reject damaged edges that prevent continuous sealed joints.</tspan></text><text x="1010" y="620" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">04</text><text x="1044" y="620" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">EXCLUDED FROM P2-W01</text><line x1="1010" y1="631" x2="1648" y2="631" stroke="#c3ccce" stroke-width="1"/><text x="1010" y="660" font-size="8.6" text-anchor="start" font-weight="400" fill="#a63f31"><tspan x="1010" dy="0">Exterior / facade walls.</tspan><tspan x="1010" dy="13.76">Sauna hot-side and wet-area build-ups.</tspan><tspan x="1010" dy="13.76">Protected-stair and fire-rated enclosures.</tspan><tspan x="1010" dy="13.76">Shafts, equipment and structural / bracing walls.</tspan></text><text x="70" y="875" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">05</text><text x="104" y="875" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">COORDINATION HOLD POINTS BEFORE CONSTRUCTION</text><line x1="70" y1="886" x2="850" y2="886" stroke="#c3ccce" stroke-width="1"/><text x="70" y="915" font-size="9.0" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="70" dy="0">Select locally available studs and boards while maintaining 250 mm nominal overall thickness.</tspan><tspan x="70" dy="13.950000000000001">Verify head movement, anchorage, fire requirement, acoustic doors, seals, outlets and penetrations.</tspan><tspan x="70" dy="13.950000000000001">Build one full-height mock-up; inspect reused board, wool fit, perimeter seals and absence of rigid bridges.</tspan><tspan x="70" dy="13.950000000000001">No STC/Rw, field DnT,w or fire rating is claimed by this schematic detail.</tspan></text><rect x="1030" y="880" width="520" height="116" fill="#f5ded8" stroke="#bf7468" stroke-width="1.2" rx="6"/><text x="1052" y="912" font-size="8" text-anchor="start" font-weight="700" fill="#a63f31" class="">AUTHORITY</text><text x="1052" y="942" font-size="8.6" text-anchor="start" font-weight="400" fill="#6f3028"><tspan x="1052" dy="0">Frozen as a DESIGN CONTROL VALUE for P2 coordination.</tspan><tspan x="1052" dy="13.33">Not a tested assembly and not for procurement or construction.</tspan></text><rect x="36" y="1060" width="1612" height="106" fill="#172a33"/><rect x="36" y="1060" width="1612" height="7" fill="#168aa3"/><text x="56" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">CONTROLLED OUTCOME</text><text x="56" y="1120" font-size="13" text-anchor="start" font-weight="700" fill="#ffffff" class="">D-059 · REFINED DOUBLE-FRAME P2 EXTERIOR ENVELOPE · DESIGN COORDINATION</text><text x="56" y="1145" font-size="7.8" text-anchor="start" font-weight="400" fill="#d3dfe2" class="">Current architectural coordination hypothesis. It does not authorize procurement, fabrication or construction.</text><line x1="1160" y1="1067" x2="1160" y2="1166" stroke="#536970" stroke-width="1"/><text x="1180" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">SHEET</text><text x="1180" y="1121" font-size="15" text-anchor="start" font-weight="700" fill="#ffffff" class="">DH-ARQ-DET-003-R20</text><text x="1180" y="1146" font-size="7.5" text-anchor="start" font-weight="400" fill="#c9d8dc" class="">R20 · 2026-08-18 · SHA 4cb65bf3b1881c...</text><line x1="1450" y1="1067" x2="1450" y2="1166" stroke="#536970" stroke-width="1"/><text x="1470" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">STATUS</text><text x="1470" y="1120" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">NOT FOR</text><text x="1470" y="1141" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">CONSTRUCTION</text></svg>
