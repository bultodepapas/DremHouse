"730" font-size="8.8" text-anchor="start" font-weight="400" fill="#172a33"><tspan x="70" dy="0">Open the complete Y=5.00–12.45 family frontage; do not leave residual wall piers.</tspan><tspan x="70" dy="13.640000000000002">Join the former mini deck to the family distributor with a full 2.80 m opening.</tspan><tspan x="70" dy="13.640000000000002">Keep both bedroom end zones fully enclosed with acoustically controlled doors.</tspan><tspan x="70" dy="13.640000000000002">Use one visually quiet, continuous and non-climbable guard along the void.</tspan></text><text x="930" y="690" font-size="9" text-anchor="start" font-weight="700" fill="#168aa3" class="">04</text><text x="964" y="690" font-size="12" text-anchor="start" font-weight="700" fill="#172a33" class="">OPEN PROFESSIONAL GATES</text><line x1="930" y1="701" x2="1580" y2="701" stroke="#c3ccce" stroke-width="1"/><text x="930" y="730" font-size="8.5" text-anchor="start" font-weight="400" fill="#a63f31"><tspan x="930" dy="0">Guard height, loads, openings, anchors and impact resistance.</tspan><tspan x="930" dy="12.92">Edge beam, floor vibration, exposed-truss topology and fire protection.</tspan><tspan x="930" dy="12.92">Smoke movement and required separation from the workshop/hall volume.</tspan><tspan x="930" dy="12.92">Hall noise transfer to the family centre and through suite entrance doors.</tspan><tspan x="930" dy="12.92">Lighting, glare, falling-object control and cleaning access over the void.</tspan></text><rect x="930" y="910" width="650" height="94" fill="#f5ded8" stroke="#bf7468" stroke-width="1.2" rx="6"/><text x="952" y="940" font-size="8" text-anchor="start" font-weight="700" fill="#a63f31" class="">AUTHORITY</text><text x="952" y="969" font-size="8.0" text-anchor="start" font-weight="700" fill="#6f3028" class="">Owner-approved spatial intent; guard, structure, fire and acoustic performance remain undesigned.</text><rect x="36" y="1060" width="1612" height="106" fill="#172a33"/><rect x="36" y="1060" width="1612" height="7" fill="#168aa3"/><text x="56" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">CONTROLLED OUTCOME</text><text x="56" y="1120" font-size="13" text-anchor="start" font-weight="700" fill="#ffffff" class="">D-063 · OPEN FAMILY BALCONY · DESIGN COORDINATION</text><text x="56" y="1145" font-size="7.8" text-anchor="start" font-weight="400" fill="#d3dfe2" class="">Current architectural coordination hypothesis. It does not authorize procurement, fabrication or construction.</text><line x1="1160" y1="1067" x2="1160" y2="1166" stroke="#536970" stroke-width="1"/><text x="1180" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">SHEET</text><text x="1180" y="1121" font-size="15" text-anchor="start" font-weight="700" fill="#ffffff" class="">DH-ARQ-DET-004-R20</text><text x="1180" y="1146" font-size="7.5" text-anchor="start" font-weight="400" fill="#c9d8dc" class="">R20 · 2026-08-18 · SHA 4cb65bf3b1881c...</text><line x1="1450" y1="1067" x2="1450" y2="1166" stroke="#536970" stroke-width="1"/><text x="1470" y="1092" font-size="8" text-anchor="start" font-weight="700" fill="#9fc4cc" class="">STATUS</text><text x="1470" y="1120" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">NOT FOR</text><text x="1470" y="1141" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff" class="">CONSTRUCTION</text></svg>
