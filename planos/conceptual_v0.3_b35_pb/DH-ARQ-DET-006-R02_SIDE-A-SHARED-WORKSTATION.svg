<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fbfaf7"/><g font-family="Arial"><text x="70" y="45" font-size="26" text-anchor="start" font-weight="700" fill="#243238">SIDE A SHARED TWO-PERSON WORKSTATION</text><text x="70" y="72" font-size="12" text-anchor="start" font-weight="400" fill="#59676c">D-078 centred 5.40 m worktop + three suspended cabinets within one 7.20 m modular opening · not for construction</text><text x="1325" y="105" font-size="16" text-anchor="end" font-weight="700" fill="#7e3f2c">DET-006-R02</text></g><text x="75" y="120" font-size="14" text-anchor="start" font-weight="700" fill="#243238">A · WALL / SILL / WORKTOP PRINCIPLE</text><rect x="90" y="170" width="90" height="440" fill="#9da7a9" stroke="#26363b" stroke-width="1.5"/><rect x="180" y="170" width="75" height="440" fill="#d8ded9" stroke="#536166" stroke-width="1"/><text x="135" y="390" font-size="7.5" text-anchor="middle" font-weight="700" fill="#243238" transform="rotate(-90 135 390)">RUGGED CORRUGATED INDUSTRIAL ENVELOPE</text><text x="217" y="390" font-size="7.5" text-anchor="middle" font-weight="700" fill="#243238" transform="rotate(-90 217 390)">INSULATED / DRAINED WALL ZONE</text><rect x="255" y="154.0" width="34" height="348.0" fill="#416771" stroke="#172126" stroke-width="2.4"/><rect x="246" y="144.0" width="52" height="10" fill="#29383d" stroke="#172126"/><rect x="246" y="502.0" width="52" height="14" fill="#29383d" stroke="#172126"/><rect x="251" y="512.0" width="225" height="16" fill="#c99f6b" stroke="#5b432b" stroke-width="1.4"/><rect x="244" y="519.4" width="52" height="18" fill="#26363b" stroke="#172126"/><text x="310" y="328.0" font-size="8" text-anchor="start" font-weight="700" fill="#294f58">REPLACEABLE MODULAR WINDOW</text><text x="315" y="524.0" font-size="7.5" text-anchor="start" font-weight="700" fill="#4f3925">0.90 m REPLACEABLE WORKTOP</text><text x="315" y="494.0" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">0.15 m INSULATED UPSTAND</text><text x="315" y="532.4" font-size="7.2" text-anchor="start" font-weight="700" fill="#243238">INDEPENDENT BOLTED SERVICE RAIL</text><text x="75" y="640" font-size="8.5" text-anchor="start" font-weight="700" fill="#8e3825">EXTERIOR PERFORMANCE FIRST</text><text x="75" y="660" font-size="7.5" text-anchor="start" font-weight="400" fill="#243238">No furniture load to glazing or unverified facade rails.</text><text x="510" y="120" font-size="14" text-anchor="start" font-weight="700" fill="#243238">B · CENTRED INTERIOR ELEVATION</text><rect x="510.0" y="170.0" width="720.0000000000001" height="290.0" fill="#426671" stroke="#172126" stroke-width="3"/><line x1="630.0" y1="170.0" x2="630.0" y2="460.0" stroke="#9bb3b8" stroke-width="1.5"/><line x1="750.0" y1="170.0" x2="750.0" y2="460.0" stroke="#9bb3b8" stroke-width="1.5"/><line x1="870.0" y1="170.0" x2="870.0" y2="460.0" stroke="#9bb3b8" stroke-width="1.5"/><line x1="990.0" y1="170.0" x2="990.0" y2="460.0" stroke="#9bb3b8" stroke-width="1.5"/><line x1="1110.0" y1="170.0" x2="1110.0" y2="460.0" stroke="#9bb3b8" stroke-width="1.5"/><line x1="870.0" y1="156.0" x2="870.0" y2="620" stroke="#b56c31" stroke-width="1.2" stroke-dasharray="7 4"/><line x1="600.0" y1="520.0" x2="1140.0" y2="520.0" stroke="#c49a62" stroke-width="14"/><line x1="600.0" y1="542.0" x2="1140.0" y2="542.0" stroke="#26363b" stroke-width="6"/><rect x="600.0" y="529.0" width="70.0" height="62.0" fill="#8d6745" stroke="#26363b" stroke-width="2"/><line x1="600.0" y1="549.6666666666666" x2="670.0" y2="549.6666666666666" stroke="#d6c1a5" stroke-width="1.2"/><line x1="600.0" y1="570.3333333333334" x2="670.0" y2="570.3333333333334" stroke="#d6c1a5" stroke-width="1.2"/><rect x="835.0" y="529.0" width="70.0" height="62.0" fill="#8d6745" stroke="#26363b" stroke-width="2"/><line x1="835.0" y1="549.6666666666666" x2="905.0" y2="549.6666666666666" stroke="#d6c1a5" stroke-width="1.2"/><line x1="835.0" y1="570.3333333333334" x2="905.0" y2="570.3333333333334" stroke="#d6c1a5" stroke-width="1.2"/><rect x="1070.0" y="529.0" width="70.0" height="62.0" fill="#8d6745" stroke="#26363b" stroke-width="2"/><line x1="1070.0" y1="549.6666666666666" x2="1140.0" y2="549.6666666666666" stroke="#d6c1a5" stroke-width="1.2"/><line x1="1070.0" y1="570.3333333333334" x2="1140.0" y2="570.3333333333334" stroke="#d6c1a5" stroke-width="1.2"/><text x="752.4999999999999" y="560" font-size="7" text-anchor="middle" font-weight="700" fill="#294b52">WORK POSITION</text><text x="987.5" y="560" font-size="7" text-anchor="middle" font-weight="700" fill="#294b52">WORK POSITION</text><text x="870.0" y="155" font-size="8" text-anchor="middle" font-weight="700" fill="#8e3825">COMMON CENTRE X=15.75 m</text><text x="870.0" y="325" font-size="8.5" text-anchor="middle" font-weight="700" fill="#eff5f5">ONE 7.20 × 2.90 m ARCHITECTURAL OPENING · MODULAR, NOT ONE GLASS SHEET</text><text x="870.0" y="585" font-size="8" text-anchor="middle" font-weight="700" fill="#5b432b">0.90 + 0.70 + 1.65 + 0.70 + 1.65 + 0.70 + 0.90 = 7.20 m</text><text x="510" y="640" font-size="14" text-anchor="start" font-weight="700" fill="#243238">C · CONTROL SCHEDULE</text><rect x="510" y="660" width="770" height="24" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="526" y="677" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">OPENING</text><text x="625" y="677" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">7.20 × 2.90 m · sill +0.90 · head +3.80 · six replaceable test modules</text><rect x="510" y="690" width="770" height="24" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="526" y="707" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">WORKTOP</text><text x="625" y="707" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">5.40 × 0.90 m · top +0.75 · 0.90 m glazed residual at each end</text><rect x="510" y="720" width="770" height="24" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="526" y="737" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">STORAGE</text><text x="625" y="737" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">three 0.70 × 0.75 × 0.62 m suspended steel three-drawer units</text><rect x="510" y="750" width="770" height="24" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="526" y="767" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">USERS</text><text x="625" y="767" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">two equal 1.65 m clear knee/chair bays · independent power/data zones</text><rect x="510" y="780" width="770" height="24" fill="#f1eee7" stroke="#c0bbb0" stroke-width=".8"/><text x="526" y="797" font-size="7.2" text-anchor="start" font-weight="700" fill="#8e3825">EXTERIOR</text><text x="625" y="797" font-size="7.0" text-anchor="start" font-weight="400" fill="#243238">direct industrial panels and trims; resistance, drainage, replacement and cost govern</text><rect x="70" y="825" width="1260" height="55" fill="#fff4df" stroke="#bd5c3c" stroke-width="1"/><text x="88" y="849" font-size="9.5" text-anchor="start" font-weight="700" fill="#8e3825">DESIGN HOLD</text><text x="205" y="849" font-size="7.2" text-anchor="start" font-weight="700" fill="#5a3a2c">Internal use and daylight govern the composition. Outside remains rugged industrial envelope, not a formal facade. Header, stability, glass safety, seals, low-eave drainage, glare, condensation, monitor/mullion alignment and quotations remain open.</text><text x="88" y="869" font-size="9.5" text-anchor="start" font-weight="700" fill="#8e3825">AUTHORITY</text><text x="205" y="869" font-size="7.2" text-anchor="start" font-weight="700" fill="#5a3a2c">Schematic coordination only. No profile, glass product, coating, connection, cabinet hardware or construction method is selected.</text></svg>