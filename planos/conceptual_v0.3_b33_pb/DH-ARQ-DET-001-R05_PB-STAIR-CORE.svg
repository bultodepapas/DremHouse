ight="10" fill="#fff" stroke="#76558f" stroke-width="2" data-column-id="STAIR-REAR-S" class="d048-column-reservation"/><rect x="457.0" y="506.0" width="10" height="10" fill="#fff" stroke="#76558f" stroke-width="2" data-column-id="STAIR-REAR-N" class="d048-column-reservation"/></g><rect x="319.8" y="521.8" width="43.199999999999996" height="39.6" fill="none" stroke="#27859a" stroke-width="1.2"/><ellipse cx="435.0" cy="548.8" rx="11" ry="15" fill="#fff" stroke="#59686d"/><rect x="377.4" y="566.8" width="37.800000000000004" height="16.2" fill="#fff" stroke="#59686d"/><rect x="319.8" y="613.5999999999999" width="37.800000000000004" height="28.8" fill="#424f54" stroke="#263238"/><text x="338.7" y="629.8000000000001" font-size="7" text-anchor="middle" font-weight="700" fill="#fff">rack</text><rect x="390.0" y="613.5999999999999" width="45.0" height="61.199999999999996" fill="#e2e7e4" stroke="#59686d"/><text x="412.5" y="644.1999999999999" font-size="6" text-anchor="middle" font-weight="700" fill="#243238">UPS / panels</text><line x1="300" y1="140.2" x2="300" y2="172.6" stroke="#9d4a2f" stroke-width="5"/><line x1="300" y1="251.79999999999998" x2="300" y2="284.2" stroke="#9d4a2f" stroke-width="5"/><line x1="300" y1="410.20000000000005" x2="300" y2="446.20000000000005" stroke="#9d4a2f" stroke-width="5"/><line x1="300" y1="521.8" x2="300" y2="554.1999999999999" stroke="#9d4a2f" stroke-width="5"/><line x1="300" y1="626.2" x2="300" y2="658.6" stroke="#9d4a2f" stroke-width="5"/><line x1="462.0" y1="250.0" x2="462.0" y2="286.0" stroke="#236a45" stroke-width="6"/><line x1="462.0" y1="408.40000000000003" x2="462.0" y2="444.40000000000003" stroke="#a63f31" stroke-width="5" stroke-dasharray="5 3" class="rear-discharge-level-conflict"/><text x="570" y="130" font-size="14" text-anchor="start" font-weight="700" fill="#6c452e">STUDY LAYERS</text><rect x="570" y="155" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="176" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">01</text><text x="622" y="176" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Great Wall: 0.20 m conceptual total; accessible subframe, absorber and slatted finish.</text><rect x="570" y="218" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="239" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">02</text><text x="622" y="239" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Standard partitions: 0.15 m with acoustic performance to be selected.</text><rect x="570" y="281" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="302" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">03</text><text x="622" y="302" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Stair: 22 equal risers at 172.7 mm; 20 goings at 270 mm; two 1.40 m flights.</text><rect x="570" y="344" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="365" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">04</text><text x="622" y="365" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Four 0.30 m column coordination reserves align PB, P2, foundations and roof lines.</text><rect x="570" y="407" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="428" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">05</text><text x="622" y="428" font-size="8" text-anchor="start" font-weight="400" fill="#243238">The 4.10 x 3.20 m clear stair rectangle closes exactly inside the 4.50 x 3.60 m enclosure.</text><rect x="570" y="470" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="491" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">06</text><text x="622" y="491" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Stringers, landings and stair connections remain independent of the primary lateral system.</text><rect x="570" y="533" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="554" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">07</text><text x="622" y="554" font-size="8" text-anchor="start" font-weight="400" fill="#243238">CF-011: the rear door meets the +1.90 m landing plane, not PB grade; do not claim discharge.</text><rect x="570" y="596" width="720" height="48" fill="#f5f2ea" stroke="#c7c3b9" stroke-width=".7"/><text x="585" y="617" font-size="10" text-anchor="start" font-weight="700" fill="#9b4e32">08</text><text x="622" y="617" font-size="8" text-anchor="start" font-weight="400" fill="#243238">Headroom, fire/smoke protection, guards, handrails, doors, bases and foundations remain open.</text><rect x="570" y="690" width="720" height="125" fill="#fff4df" stroke="#bd5c3c"/><text x="588" y="718" font-size="12" text-anchor="start" font-weight="700" fill="#8e3825">BLOCKING COORDINATION</text><text x="592" y="742" font-size="8" text-anchor="start" font-weight="400" fill="#3f4c51">• select a buildable rear grade-discharge alternative and verify it in section</text><text x="592" y="757" font-size="8" text-anchor="start" font-weight="400" fill="#3f4c51">• verify 2.05 m minimum headroom with actual stringer and landing-beam depths</text><text x="592" y="772" font-size="8" text-anchor="start" font-weight="400" fill="#3f4c51">• design fire/smoke enclosure, doors, guards, handrails and slip-resistant finish</text><text x="592" y="787" font-size="8" text-anchor="start" font-weight="700" fill="#8e3825">• analyse the four-column frame, diaphragm collectors, drift joints and erection</text><text x="592" y="802" font-size="8" text-anchor="start" font-weight="400" fill="#3f4c51">• size members, joints, bases and foundations from site and geotechnical inputs</text></svg>